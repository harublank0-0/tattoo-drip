# Settings every layout shares: included inside http {} by nginx.conf (the live
# layout) and nginx.split.conf (the D11 layout, docs/discover/domain-migration.md).
# Values: apps/platform/docs/deploy.md, "Reverse proxy". Checked by
# deploy/test/nginx/run.sh.

server_tokens off;

# The container's standard output. No Referer: a page opened from a token link
# would put the token's URL in the log line of every request it makes.
log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent "$http_user_agent" $request_time';

# Links with a token in the path: a deposit link (30 days) and the account links
# (an hour, a day, 7 days). The token locations turn their access log off, but
# a request nginx rejects before it picks a location (a header too large: 400) is
# logged by the server's default settings. This map makes the same call for those:
# on $uri, the decoded and normalized path, as the locations match it. A request
# line nginx cannot parse (a malformed one: 400, or one too long: 414) has no $uri
# and is still logged. It holds on every host, so a legacy redirect of a token
# link (nginx.split.conf) is not logged either.
map $uri $loggable {
	~^/api/v1/tenants/[^/]+/deposits/ 0;
	~^/(reset-password|verify-email|invitations)/ 0;
	default 1;
}
access_log /dev/stdout main if=$loggable;

# The visitor's address. Only cloudflared (the one address that reaches nginx
# from outside) is believed when it names the visitor in CF-Connecting-IP, which
# Cloudflare sets itself and overwrites if the visitor sends one. From anyone
# else the header is ignored and $remote_addr stays the peer's.
set_real_ip_from 172.30.42.20;
real_ip_header CF-Connecting-IP;

# The parser's 20 MB plus multipart overhead.
client_max_body_size 21m;
client_header_timeout 15s;
# Between two reads, not for the whole body.
client_body_timeout 30s;
send_timeout 30s;

# The apps' fixed addresses in deploy/compose.yml, not their service names: nginx
# resolves a name once, when it starts or reloads, and a restarted container can
# come back on another address (a name would then answer 502 until a reload, or
# stop nginx from starting while the app is down). An address needs neither.
#
# The apps close an idle connection after 5 s (Node's default): nginx closes first.
upstream web {
	server 172.30.42.11:3333;
	keepalive 8;
	keepalive_timeout 4s;
}
upstream storefront {
	server 172.30.42.12:3000;
	keepalive 8;
	keepalive_timeout 4s;
}
