# The live layout: the dashboard and the API both on tattoodrip.app. Included by
# nginx.conf. Replaced by hosts.split.conf at the D11 cutover
# (docs/discover/domain-migration.md); kept until the rollback window closes.

# Dashboard and API.
server {
	listen 80;
	server_name tattoodrip.app;

	# The token links (see $loggable in common.conf). Regex locations, because a
	# prefix location with * matches nothing. access_log off, and error_log at crit,
	# since nginx writes the request line into warn and error lines too (an upload
	# buffered to a temporary file, an upstream that fails). What is left is a
	# crit-level line, which can still carry the request line; nothing here is
	# expected to produce one.
	location ~ ^/api/v1/tenants/[^/]+/deposits/ {
		access_log off;
		error_log /dev/stderr crit;
		proxy_pass http://web;
		include /etc/nginx/td/proxy.conf;
	}
	location ~ ^/(reset-password|verify-email|invitations)/ {
		access_log off;
		error_log /dev/stderr crit;
		proxy_pass http://web;
		include /etc/nginx/td/proxy.conf;
	}

	location / {
		proxy_pass http://web;
		include /etc/nginx/td/proxy.conf;
	}
}
