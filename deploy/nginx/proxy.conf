# The proxy settings every location shares: included by each location that has
# a proxy_pass (nginx.conf). Keeping them in one file keeps the locations that
# turn off the access log identical to the others.

# HTTP/1.1 without a Connection header lets nginx reuse its upstream connections.
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
# $remote_addr is the visitor (real_ip_header in nginx.conf) when the request
# came through cloudflared, else the peer's own address. X-Forwarded-For is
# set, not appended to ($proxy_add_x_forwarded_for): the apps take its first
# value as the visitor, so nothing the visitor sent may stay in it.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
# Cloudflare ends the visitor's TLS; the apps only ever serve https.
proxy_set_header X-Forwarded-Proto https;
# Set to the Host nginx routed on, so nothing the visitor sent reaches the apps:
# the platform trusts X-Forwarded-Host from a trusted proxy (nginx is one).
proxy_set_header X-Forwarded-Host $host;
# The standard header carries the same claims (for=, host=, proto=) and nothing
# here sets it: drop the visitor's.
proxy_set_header Forwarded "";

# The apps are on this host's bridge, where a connect takes well under a
# millisecond: a stopped or restarting app fails within 3 s (502, or 504 when its
# address answers nothing) instead of holding the visitor for nginx's default 60 s.
proxy_connect_timeout 3s;

# nginx takes a slow upload whole before the app holds anything for it.
proxy_request_buffering on;
# Above the app's 120 s dashboard upload deadline, so its 408 reaches the client.
proxy_read_timeout 130s;
