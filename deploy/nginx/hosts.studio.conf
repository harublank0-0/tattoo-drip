# The hosts every layout routes the same way: included inside http {} by
# nginx.conf and nginx.split.conf.

# Studio pages: the apex and every studio's subdomain.
server {
	listen 80;
	server_name tattoodrip.page *.tattoodrip.page;

	location / {
		proxy_pass http://storefront;
		include /etc/nginx/td/proxy.conf;
	}
}

# Any other Host (a scanner, a request by address): closed without an answer.
server {
	listen 80 default_server;
	server_name _;
	return 444;
}
