# The D11 layout (docs/discover/domain-migration.md): Studio OS on
# app.tattoodrip.app, the API on api.tattoodrip.app, Discover on tattoodrip.app.
# Included by nginx.split.conf only. NOT LIVE: production runs nginx.conf, whose
# layout is hosts.current.conf. The cutover switches nginx.conf's include from
# hosts.current.conf to this file; rollback switches it back. Checked by
# deploy/test/nginx/run.sh (both layouts).

# Discover (D05) at the next fixed address on the stack's subnet. Until its
# container exists, the apex's Discover paths answer 502: this layout is not to
# go live before Discover is deployed (cutover checklist).
upstream discover {
	server 172.30.42.13:3000;
	keepalive 8;
	keepalive_timeout 4s;
}

# The visitor's country for Discover's local-first lists (D06.5,
# docs/discover/frontend.md, "Country"): a relevance hint, never access control.
# Cloudflare names it in CF-IPCountry, but a visitor can send that header too, so
# it is believed only on a connection from cloudflared (the one address that
# reaches nginx from outside, as for CF-Connecting-IP in common.conf; matched on
# $realip_remote_addr, the peer before real_ip rewrites $remote_addr), and only
# as two letters. Discover's location always sets X-Discover-Country from this:
# empty (the header is then not sent at all) for anyone else, so a visitor can
# neither spoof it through CF-IPCountry from inside the network nor send their
# own X-Discover-Country. Discover reads it only when DISCOVER_GEO_HEADER names
# it (off by default) and checks the code itself (Cloudflare's XX and T1 are not
# countries). Cloudflare overwriting a visitor's own CF-IPCountry at the edge is
# a D11 verification step (domain-migration.md).
geo $realip_remote_addr $from_cloudflared {
	default 0;
	172.30.42.20 1;
}
map "$from_cloudflared:$http_cf_ipcountry" $discover_country {
	"~^1:(?<cf_country>[A-Za-z]{2})$" $cf_country;
	default "";
}

# Studio OS: the dashboard, sign-in and account links. The platform also answers
# /api here (cookieless, as everywhere), but nothing is configured to call it.
server {
	listen 80;
	server_name app.tattoodrip.app;

	# The account links carry a token (see $loggable in common.conf); as in
	# hosts.current.conf, no access log and errors only at crit.
	location ~ ^/(reset-password|verify-email|invitations)/ {
		access_log off;
		error_log /dev/stderr crit;
		proxy_pass http://web;
		include /etc/nginx/td/proxy.conf;
	}

	location / {
		proxy_pass http://web;
		include /etc/nginx/td/proxy.conf;
	}
}

# The public API: /api only. Anything else is nginx's own 404, so no dashboard
# page, sign-in form or cookie is ever served from this host (the platform's
# API_URL host check refuses them too).
server {
	listen 80;
	server_name api.tattoodrip.app;

	location ~ ^/api/v1/tenants/[^/]+/deposits/ {
		access_log off;
		error_log /dev/stderr crit;
		proxy_pass http://web;
		include /etc/nginx/td/proxy.conf;
	}

	# /api itself too, as the platform counts it (its 404 envelope, not nginx's).
	location ~ ^/api(/|$) {
		proxy_pass http://web;
		include /etc/nginx/td/proxy.conf;
	}

	location / {
		return 404;
	}
}

# Discover, plus compatibility for links made before the cutover.
server {
	listen 80;
	server_name tattoodrip.app;

	# Old dashboard and account addresses (bookmarks, the installed app's
	# /dashboard, and emailed links: an invitation lives 7 days) go to Studio OS
	# with the same path and query. 307 keeps the method and body and is not
	# cached for good by browsers, so a rollback is not stuck behind remembered
	# redirects; it becomes 308 once the rollback window is over. Discover must
	# never use these paths (docs/discover/domain-migration.md, "Legacy URLs").
	# A token link is redirected unlogged ($loggable) to the host that reads it.
	location ~ ^/(login|logout|signup|forgot-password|reset-password|verify-email|confirm-email|invitations|dashboard|onboarding|account)(/|$) {
		return 307 https://app.tattoodrip.app$request_uri;
	}
	location ^~ /t/ {
		return 307 https://app.tattoodrip.app$request_uri;
	}

	# The old API address: proxied, not redirected, so a storefront page or SDK
	# still holding https://tattoodrip.app keeps working (a redirected multipart
	# POST or CORS preflight would not). Retired after the window
	# (domain-migration.md).
	location ~ ^/api/v1/tenants/[^/]+/deposits/ {
		access_log off;
		error_log /dev/stderr crit;
		proxy_pass http://web;
		include /etc/nginx/td/proxy.conf;
	}
	location ~ ^/api(/|$) {
		proxy_pass http://web;
		include /etc/nginx/td/proxy.conf;
	}

	# The dashboard registered a service worker (apps/platform/public/sw.js) on
	# this origin. A browser checks the script again on its next visit: this one
	# replaces it, deletes its caches and unregisters, so the old worker never
	# answers for Discover. Discover must not register a worker at /sw.js.
	location = /sw.js {
		default_type application/javascript;
		add_header Cache-Control "no-cache" always;
		return 200 "self.addEventListener('install', () => self.skipWaiting());\nself.addEventListener('activate', (event) => {\n\tevent.waitUntil(\n\t\tcaches\n\t\t\t.keys()\n\t\t\t.then((names) => Promise.all(names.map((name) => caches.delete(name))))\n\t\t\t.then(() => self.registration.unregister()),\n\t);\n});\n";
	}

	location / {
		proxy_pass http://discover;
		include /etc/nginx/td/proxy.conf;
		# Always set, so a visitor's own header never passes (see $discover_country).
		proxy_set_header X-Discover-Country $discover_country;
	}
}
