# The D11 domain layout, for rehearsals only: Studio OS on app.tattoodrip.app,
# the API on api.tattoodrip.app, Discover on tattoodrip.app
# (docs/discover/domain-migration.md). Production never starts nginx with this
# file: deploy/compose.yml uses nginx.conf, whose layout include has been
# hosts.split.conf since the D11 cutover, so the two files load the same hosts.
#
#   nginx -c /etc/nginx/td/nginx.split.conf -t
#   deploy/test/nginx/run.sh   (checks this file, nginx.current.conf and nginx.conf)

user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/td/common.conf;
	include /etc/nginx/td/hosts.split.conf;
	include /etc/nginx/td/hosts.studio.conf;
}
