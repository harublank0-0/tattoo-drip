# Reverse proxy of the single-server deploy: cloudflared -> nginx -> the
# platform's web server and the storefront. This directory is mounted read-only at
# /etc/nginx/td and nginx runs with -c /etc/nginx/td/nginx.conf (deploy/compose.yml).
# Values: apps/platform/docs/deploy.md, "Reverse proxy". Checked by
# deploy/test/nginx/run.sh.

user nginx;
worker_processes auto;
# stderr, for Docker's log rotation. Request lines of the token locations below
# stay out of it too (see there).
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	server_tokens off;

	# The container's standard output. No Referer: a page opened from a token link
	# would put the token's URL in the log line of every request it makes.
	log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent "$http_user_agent" $request_time';

	# Links with a token in the path: a deposit link (30 days) and the account links
	# (an hour, a day, 7 days). The two locations below turn their access log off, but
	# a request nginx rejects before it picks a location (a header too large, a bad
	# request line: 400) is logged by the server's default settings. This map makes
	# the same call for those: on $uri, the decoded and normalized path, as the
	# locations match it. A request line too long to parse (414) has no $uri and is
	# still logged.
	map $uri $loggable {
		~^/api/v1/tenants/[^/]+/deposits/ 0;
		~^/(reset-password|verify-email|invitations)/ 0;
		default 1;
	}
	access_log /dev/stdout main if=$loggable;

	# The visitor's address. Only cloudflared (the one address that reaches nginx
	# from outside) is believed when it names the visitor in CF-Connecting-IP, which
	# Cloudflare sets itself and overwrites if the visitor sends one. From anyone
	# else the header is ignored and $remote_addr stays the peer's.
	set_real_ip_from 172.30.42.20;
	real_ip_header CF-Connecting-IP;

	# The parser's 20 MB plus multipart overhead.
	client_max_body_size 21m;
	client_header_timeout 15s;
	# Between two reads, not for the whole body.
	client_body_timeout 30s;
	send_timeout 30s;

	# The apps' fixed addresses in deploy/compose.yml, not their service names: nginx
	# resolves a name once, when it starts or reloads, and a restarted container can
	# come back on another address (a name would then answer 502 until a reload, or
	# stop nginx from starting while the app is down). An address needs neither.
	#
	# The apps close an idle connection after 5 s (Node's default): nginx closes first.
	upstream web {
		server 172.30.42.11:3333;
		keepalive 8;
		keepalive_timeout 4s;
	}
	upstream storefront {
		server 172.30.42.12:3000;
		keepalive 8;
		keepalive_timeout 4s;
	}

	# Dashboard and API.
	server {
		listen 80;
		server_name tattoodrip.app;

		# The token links (see $loggable above). Regex locations, because a prefix
		# location with * matches nothing. access_log off, and error_log at crit, since
		# nginx writes the request line into warn and error lines too (an upload
		# buffered to a temporary file, an upstream that fails). What is left is a
		# crit-level line, which can still carry the request line; nothing here is
		# expected to produce one.
		location ~ ^/api/v1/tenants/[^/]+/deposits/ {
			access_log off;
			error_log /dev/stderr crit;
			proxy_pass http://web;
			include /etc/nginx/td/proxy.conf;
		}
		location ~ ^/(reset-password|verify-email|invitations)/ {
			access_log off;
			error_log /dev/stderr crit;
			proxy_pass http://web;
			include /etc/nginx/td/proxy.conf;
		}

		location / {
			proxy_pass http://web;
			include /etc/nginx/td/proxy.conf;
		}
	}

	# Studio pages: the apex and every studio's subdomain.
	server {
		listen 80;
		server_name tattoodrip.page *.tattoodrip.page;

		location / {
			proxy_pass http://storefront;
			include /etc/nginx/td/proxy.conf;
		}
	}

	# Any other Host (a scanner, a request by address): closed without an answer.
	server {
		listen 80 default_server;
		server_name _;
		return 444;
	}
}
