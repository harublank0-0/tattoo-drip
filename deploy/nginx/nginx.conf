# Reverse proxy of the single-server deploy: cloudflared -> nginx -> the
# platform's web server and the storefront. This directory is mounted read-only at
# /etc/nginx/td and nginx runs with -c /etc/nginx/td/nginx.conf (deploy/compose.yml).
# Values: apps/platform/docs/deploy.md, "Reverse proxy". Checked by
# deploy/test/nginx/run.sh.
#
# The live layout is hosts.current.conf (dashboard and API on tattoodrip.app).
# The D11 cutover changes that one include to hosts.split.conf, which
# nginx.split.conf already loads for rehearsals; rollback changes it back
# (docs/discover/domain-migration.md).

user nginx;
worker_processes auto;
# stderr, for Docker's log rotation. The token locations log only at crit, so
# their request lines stay out of it except in a crit-level line (see there).
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/td/common.conf;
	include /etc/nginx/td/hosts.current.conf;
	include /etc/nginx/td/hosts.studio.conf;
}
