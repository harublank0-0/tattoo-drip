# The layout before the D11 cutover, for rehearsals and the rollback only:
# Studio OS and the API on tattoodrip.app, app. and api. closed
# (docs/discover/domain-migration.md, "Rollback"). Production never starts nginx
# with this file: deploy/compose.yml uses nginx.conf (hosts.split.conf since the
# cutover); the rollback deploys the release before it, whose nginx.conf loads
# hosts.current.conf like this file.
#
#   nginx -c /etc/nginx/td/nginx.current.conf -t
#   deploy/test/nginx/run.sh   (checks this file, nginx.split.conf and nginx.conf)

user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/td/common.conf;
	include /etc/nginx/td/hosts.current.conf;
	include /etc/nginx/td/hosts.studio.conf;
}
