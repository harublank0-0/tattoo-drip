openapi: 3.1.0
info:
  title: Tattoo Drip public API
  version: 1.0.0-draft
  description: |
    Public storefront API. This document is the source of truth for
    `@tattoo-drip/types` and `@tattoo-drip/sdk`. Changes within v1 must be additive.

    Conventions for every endpoint (TAT-32):

    - **Stateless and cookieless.** No session and no CSRF token; no
      response ever sets a cookie.
    - **CORS** is open to any origin without credentials:
      `Access-Control-Allow-Origin: *` on every response, for GET, HEAD and
      POST with the `Accept`, `Content-Type` and `X-Challenge-Token` request
      headers. `Retry-After` is readable.
    - **Tenant from the path.** Tenant endpoints live under
      `/tenants/{tenant}`; the slug is matched exactly, never case-folded.
    - **Envelopes.** A success body is `{ "data": … }`; an error body is
      `{ "error": { "code", "message", "fields"? } }` (`ErrorResponse`). A
      path that exists answers other methods with 405 and `Allow`.
    - **Caching.** Reads that say so send
      `Cache-Control: public, max-age=60, stale-while-revalidate=600` and an
      `ETag` (`If-None-Match` gets a 304). Everything else, errors included,
      is `Cache-Control: no-store`.
    - **Rate limits (TAT-38).** Every request counts against its caller
      before its body is read, reads and writes apart; reads also count per
      studio. Over a limit the answer is 429 `rate_limited` with
      `Retry-After` (seconds). A response served from a cache is not
      counted. Never retry a write automatically.
    - **Busy and slow uploads (TAT-38).** A write may be 503
      `service_busy` with `Retry-After` while too many uploads are in
      progress (429 `rate_limited` for one address); an upload whose body
      takes longer than 90 seconds is 408 `request_timeout`.
    - **Server key.** The hosted storefront's server sends a secret key
      (`Authorization: Bearer`) and its visitor's address (`X-Visitor-IP`)
      so that its server-side calls count per visitor. The key grants no
      data and no access: every endpoint answers the same without it. It
      is an operational header, not an authentication scheme; never send it
      from a browser (CORS allows neither header).
servers:
  - url: https://api.example.com/api/v1

tags:
  - name: MVP
    description: What the pilot's studio page uses.
  - name: V1
    description: Planned for the paid launch (docs/requirements.md, V1). Not implemented; the shapes may still change.

paths:
  /styles:
    get:
      operationId: listStyles
      tags: [V1]
      summary: Platform-wide tattoo styles
      responses:
        "200":
          description: Styles
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/TattooStyle" } }

  /placements:
    get:
      operationId: listPlacements
      tags: [V1]
      summary: Platform-wide body placements
      responses:
        "200":
          description: Placements
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/BodyPlacement" } }

  /tenants/{tenant}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: getStudio
      tags: [MVP]
      summary: The studio's public profile
      description: |
        What the studio page shows about the studio: its name, intro,
        contact details, links, timezone, whether it takes inquiries
        (TAT-44) and its cover photo (TAT-116). Never its deposit policy, payment details, members or
        anything about clients, inquiries or payments. Cacheable. Under an
        old slug it answers like under the current one, and `slug` is the
        current slug.
      responses:
        "200":
          description: Studio
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/Studio" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /tenants/{tenant}/artists:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listArtists
      tags: [MVP]
      summary: The studio's visible artists
      description: |
        Every visible artist, by name (ignoring case), each with up to six
        photos of their work (TAT-116); hidden and deleted artists never
        appear, nor do their photos, and a studio with no visible artist
        answers an empty list. Cacheable. Under an old slug it answers like under
        the current one.
      responses:
        "200":
          description: Artists
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Artist" } }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /tenants/{tenant}/artists/{artist}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/ArtistSlug"
    get:
      operationId: getArtist
      tags: [MVP]
      summary: One visible artist, by slug
      description: |
        A hidden, deleted or unknown artist, another studio's, and an
        artist's old slug are the same 404 (`not_found`). Cacheable. Under
        an old studio slug it answers like under the current one.
      responses:
        "200":
          description: Artist
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/Artist" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /tenants/{tenant}/services:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listServices
      tags: [V1]
      summary: Bookable services of a tenant
      parameters:
        - name: artistId
          in: query
          description: Only services this artist offers
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Service" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /tenants/{tenant}/portfolio:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listPortfolio
      tags: [V1]
      summary: Portfolio projects, newest first
      parameters:
        - name: artistId
          in: query
          schema: { type: string, format: uuid }
        - name: style
          in: query
          description: Style slug
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 24 }
      responses:
        "200":
          description: A page of projects
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PortfolioProject" } }
                  nextCursor: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/NotFound" }

  /tenants/{tenant}/availability:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    get:
      operationId: listAvailability
      tags: [V1]
      summary: Bookable slots for an artist and service
      description: Slots are computed, never stored. The range is clamped to the tenant's minimum notice and booking horizon.
      parameters:
        - name: artistId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: serviceId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          description: First day (in the tenant's timezone)
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Last day, inclusive (in the tenant's timezone)
          schema: { type: string, format: date }
      responses:
        "200":
          description: Slots
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Slot" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /tenants/{tenant}/inquiries:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    post:
      operationId: createInquiry
      tags: [MVP]
      summary: Send the studio an inquiry, with reference images
      parameters:
        - $ref: "#/components/parameters/ChallengeToken"
      description: |
        No account needed. One `multipart/form-data` request with the fields
        and up to 5 reference images (JPEG, PNG or WebP, 10 MB each and
        20 MB for the whole request); any other body is a 415. The studio
        finds the person by phone; the answer is the same whether or not it
        knew the number, and says nothing but the new inquiry's id. Never
        cached. Under an old slug it is a 404: send it to the current slug,
        which `getStudio` names.

        Own codes (409): `artist_not_accepting` (the chosen artist takes no
        new inquiries), `studio_not_accepting` (no artist chosen, and every
        artist of the studio is closed), `too_many_open_inquiries` (this
        phone number already has 3 inquiries the studio hasn't answered).
        An unknown or hidden `preferredArtistId` is `validation_failed` on
        `preferredArtistId`; an image that isn't a JPEG, PNG or WebP is
        `validation_failed` on `referenceImages.<index>`.

        Abuse protection (TAT-55): send the bot-challenge token in
        `X-Challenge-Token` and leave the honeypot field `website` out. A
        missing, invalid, expired or reused token, or a filled `website`, is
        403 `challenge_failed`; when the API can't check the token it is 503
        `challenge_unavailable`. Requests are rate-limited per address, per
        studio and per phone number (429 `rate_limited` with `Retry-After`,
        up to a day for one phone number).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/InquiryForm" }
            encoding:
              referenceImages:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "201":
          description: Received. The studio replies on WhatsApp or Viber.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/InquiryReceipt" }
        "400": { $ref: "#/components/responses/Error" }
        "403":
          description: The bot challenge failed (`challenge_failed`). Get a new token and send again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/Error" }
        "409":
          description: The studio takes no such inquiry now (`artist_not_accepting`, `studio_not_accepting`, `too_many_open_inquiries`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: The bot challenge could not be checked (`challenge_unavailable`), or the API is busy (`service_busy`, with `Retry-After`). Try again in a minute.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }

  /tenants/{tenant}/deposits/{token}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/DepositToken"
    get:
      operationId: getDeposit
      tags: [MVP]
      summary: A project's deposit page, through its link
      description: |
        What the client's deposit page shows: the studio, the project's
        brief, the deposit, the reference code to write in the payment
        remark, the studio's payment methods (only while the deposit is
        due), its deposit policy, and once it is paid, the project's next
        session. Never cached. Every link that doesn't
        work (unknown, replaced, expired, another studio's, or its project
        gone) is the same 404. Rate-limited per address and per link.
      responses:
        "200":
          description: The deposit page
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/DepositPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: submitDepositProof
      tags: [MVP]
      summary: Send a screenshot of the deposit payment
      description: |
        One `multipart/form-data` request: the screenshot (`proof`, a JPEG,
        PNG or WebP of 10 MB at most), how the client paid (`method`, one of
        the page's `paymentMethods` kinds) and the amount the page showed
        (`expectedAmount`, its `deposit.due`). The API keeps the image
        privately, records a payment for the studio to check, and answers
        with the page as it now is (`submitted`). One screenshot waits at a
        time. Under an old slug it is a 404. Rate-limited per address and
        per link.

        Own codes (409): `deposit_not_due` (the page's state isn't `due`, for
        example a screenshot already waits; reload the page) and
        `deposit_changed` (`expectedAmount` isn't what is due now; reload
        the page).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/DepositProofForm" }
            encoding:
              proof:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "201":
          description: Received. The studio checks it and confirms on WhatsApp or Viber.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/DepositPage" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/Error" }
        "409":
          description: The page can't take a screenshot now (`deposit_not_due`, `deposit_changed`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: The API is busy (`service_busy`, with `Retry-After`). Try again in a moment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    Tenant:
      name: tenant
      in: path
      required: true
      description: |
        Tenant slug (also its subdomain), matched exactly: never case-folded.
        A tenant's old slugs answer reads (GET, HEAD) like its current slug,
        and the tenant resource names the current one. Any other method under
        an old slug is a 404, so writes must use the current slug.
      schema:
        type: string
        minLength: 3
        maxLength: 63
        pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
    DepositToken:
      name: token
      in: path
      required: true
      description: |
        The deposit link's secret: the fragment of the link the studio sent
        (`https://<studio>/deposit#<token>`). A bearer secret: never log it
        or send it to analytics.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
    ChallengeToken:
      name: X-Challenge-Token
      in: header
      required: true
      description: |
        The bot-challenge token the studio page's Cloudflare Turnstile widget
        made for this submission, rendered with action `inquiry`. Single-use:
        get a new one for every request, also after a refusal. Missing,
        invalid, expired, already used, or made on another page or for
        another form: 403 `challenge_failed`. A local development server
        without the challenge set up ignores it.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    ArtistSlug:
      name: artist
      in: path
      required: true
      description: |
        The artist's slug, matched exactly: never case-folded. An artist's
        old slug is not kept: after a change it is a 404.
      schema:
        type: string
        minLength: 2
        maxLength: 63
        pattern: "^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$"

  headers:
    CacheControl:
      description: "`public, max-age=60, stale-while-revalidate=600` on a cacheable read; `no-store` on everything else."
      schema: { type: string }
    ETag:
      description: Strong entity tag of the body. Send it back as `If-None-Match` to get a 304 while it still matches.
      schema: { type: string }
    RetryAfter:
      description: Seconds until another request may succeed.
      schema: { type: integer, minimum: 0 }

  responses:
    NotModified:
      description: The `If-None-Match` tag still matches; no body
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        ETag: { $ref: "#/components/headers/ETag" }
    NotFound:
      description: Unknown tenant or resource, or a write under an old slug (`not_found`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: Invalid input (`validation_failed`, with `fields`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Too many requests (`rate_limited`)
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Error:
      description: Any other error, with one of the codes `ErrorResponse` lists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: |
                Stable and machine-readable. Shared codes: `bad_request` (400,
                an unreadable body), `not_found` (404), `method_not_allowed`
                (405), `payload_too_large` (413), `unsupported_media_type`
                (415), `validation_failed` (422, with `fields`),
                `rate_limited` (429, with `Retry-After`), `internal_error`
                (500), `request_timeout` (408, an upload that took too long)
                and `service_busy` (503, with `Retry-After`: too many uploads
                in progress, or no database connection free). Endpoint codes: `artist_not_accepting`,
                `studio_not_accepting`, `too_many_open_inquiries` (409),
                `challenge_failed` (403) and `challenge_unavailable` (503),
                all `createInquiry`; `deposit_not_due`, `deposit_changed`
                (409, `submitDepositProof`). Treat an unknown code by its HTTP
                status.
              examples: [not_found, validation_failed, rate_limited, service_busy, too_many_open_inquiries, challenge_failed, deposit_changed]
            message:
              type: string
              description: A sentence for people. Never parse it.
            fields:
              type: object
              description: Field path (dot-separated, e.g. `contactPhone` or `referenceImages.0`) → messages. Only on `validation_failed`.
              additionalProperties: { type: array, items: { type: string } }

    TattooStyle:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, examples: [fine-line] }
        name: { type: string, examples: [Fine line] }

    BodyPlacement:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, examples: [forearm] }
        name: { type: string, examples: [Forearm] }

    Image:
      type: object
      required: [url, width, height, variants]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Public and absolute.
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        alt: { type: [string, "null"] }
        variants:
          type: array
          maxItems: 8
          description: |
            Smaller copies, narrowest first, each narrower than `width`. The
            widths depend on the kind of image: 320, 640 and 1280 px for
            photos, 640, 960, 1280 and 1600 px for a cover, only those below
            the image's own width. Empty for an image stored before them or too
            small to have any: then show `url` alone. Build `srcset` from
            these and `url` at `width`.
          items: { $ref: "#/components/schemas/ImageVariant" }

    Photo:
      type: object
      description: |
        An artist's photo (TAT-44) and its smaller copies: an `Image`
        without `alt`, so every property is always there. The page builds the
        `alt` text from the artist's name.
      required: [url, width, height, variants]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Public and absolute.
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        variants:
          type: array
          maxItems: 8
          description: |
            Smaller copies, narrowest first, each narrower than `width`
            (320, 640 and 1280 px, those below the image's own width). Empty
            for an image stored before them or too small to have any: then
            show `url` alone. Build `srcset` from these and `url` at `width`.
          items: { $ref: "#/components/schemas/ImageVariant" }

    WorkPhoto:
      type: object
      description: |
        A photo of an artist's work (TAT-116) and its smaller copies. Every
        property is always there. It carries no id, key, styles, healed mark
        or timestamp: the list's order is newest first.
      required: [url, width, height, alt, variants]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Public and absolute.
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        alt:
          type: [string, "null"]
          maxLength: 200
          description: |
            The studio's own description of the photo, one line of plain
            text, or null: then build one from the artist's name, such as
            "Tattoo by Sita Rai, photo 2 of 4".
        variants:
          type: array
          maxItems: 8
          description: |
            Smaller copies, narrowest first, each narrower than `width`
            (320, 640 and 1280 px, those below the photo's own width). Empty
            for a photo too small to have any: then show `url` alone. Build
            `srcset` from these and `url` at `width`.
          items: { $ref: "#/components/schemas/ImageVariant" }

    ImageVariant:
      type: object
      description: |
        A smaller copy of an image (TAT-112), for `srcset`: the same picture
        in the same format, `width` px wide; its height keeps the image's
        aspect ratio.
      required: [url, width]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Absolute, on the same origin as the image's `url`.
        width: { type: integer, minimum: 1 }

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, description: Minor units (cents) }
        currency: { type: string, description: ISO 4217 code, examples: [USD] }

    SocialLink:
      type: object
      required: [platform, url]
      additionalProperties: false
      properties:
        platform:
          type: string
          description: |
            `instagram`, `facebook`, `tiktok` or `website` today. Show any
            other value as a plain link.
          examples: [instagram]
        url:
          type: string
          format: uri
          description: An https URL.

    StorefrontSection:
      description: |
        One section of the studio page (TAT-56). Show the sections in the
        order they are listed. Treat an unknown `type` as one to leave out.
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          description: |
            `artists` (the artists list) or `inquiry` (the idea form, always
            listed). More will come: treat an unknown value as one to leave
            out.
          type: string
          enum: [artists, inquiry]

    StorefrontConfiguration:
      description: |
        How the studio page looks (TAT-56): the owner's choices, as checked
        values only, never markup, CSS or scripts. Colours and fonts are
        applied by the page from fixed lists. Each value stands alone: a
        value you do not know falls back to its default and the rest still
        applies. A studio that set nothing gets the defaults.
      type: object
      required: [theme, branding, sections]
      additionalProperties: false
      properties:
        theme:
          description: |
            The studio's theme. More will come: treat an unknown value as
            `stencil-and-ink`.
          type: string
          enum: [stencil-and-ink]
        branding:
          type: object
          required: [logo, colors, font]
          additionalProperties: false
          properties:
            logo:
              description: |
                The studio's logo, or null. `alt` is always null (it sits
                beside the studio's name). A PNG keeps its transparency.
              oneOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }]
            colors:
              type: object
              required: [accent, accentDark]
              additionalProperties: false
              properties:
                accent:
                  description: |
                    The studio's colour for buttons, links and the frame
                    around photos, `#rrggbb` in lowercase, 4.5:1 or more on
                    `#f7f3ee`; null is the theme's own violet.
                  type: [string, "null"]
                  pattern: "^#[0-9a-f]{6}$"
                  examples: ["#0f766e"]
                accentDark:
                  description: |
                    The same for dark mode, 4.5:1 or more on `#14110f`; null
                    is a lighter shade of `accent` (or the theme's violet).
                  type: [string, "null"]
                  pattern: "^#[0-9a-f]{6}$"
                  examples: ["#a99cff"]
            font:
              description: |
                The face of the studio's name and headings, a key into the
                page's fixed list. More will come: treat an unknown value as
                `eczar`.
              type: string
              enum: [eczar, serif, sans]
        sections:
          description: The sections to show, in order. The form is always there.
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: "#/components/schemas/StorefrontSection" }

    Studio:
      type: object
      description: |
        A tenant's public profile (TAT-44): what its owners were told the
        studio page shows. Every property is always there; an empty one is
        `null` or `[]`. All text is plain text: render it as text, never as
        HTML.
      required: [slug, name, type, intro, timezone, contact, socialLinks, acceptingInquiries, cover, storefront]
      additionalProperties: false
      properties:
        slug:
          type: string
          description: The current slug, also when the request used an old one
        name: { type: string, maxLength: 120 }
        type:
          type: string
          enum: [studio, independent]
          description: |
            `independent` is one artist working alone; their own profile is
            the studio's one artist.
        intro: { type: [string, "null"], maxLength: 1000 }
        timezone:
          type: string
          description: The IANA timezone of the studio's dates and times
          examples: [Asia/Kathmandu]
        contact:
          type: object
          required: [phone, email, address]
          additionalProperties: false
          properties:
            phone:
              type: [string, "null"]
              description: E.164
              examples: ["+9779812345678"]
            email:
              type: [string, "null"]
              format: email
              description: The studio's contact email
            address:
              type: [string, "null"]
              maxLength: 300
              description: Free text; keep its line breaks
        socialLinks:
          type: array
          description: |
            The links the studio set, in this order: instagram, facebook,
            tiktok, website. Only https links.
          items: { $ref: "#/components/schemas/SocialLink" }
        acceptingInquiries:
          type: boolean
          description: |
            Whether `createInquiry` takes an inquiry that names no artist.
            False only when every visible artist is closed (that inquiry
            would be the 409 `studio_not_accepting`); a studio with no
            visible artist takes general inquiries.
        cover:
          description: |
            The studio's cover photo (TAT-116), at most 2048 px on its longer
            side, with its smaller copies, or null. The studio page opens on
            it with the studio's name over it. `alt` is always null: the name
            over it says what the page is. It is the page's hero image; there
            is no other.
          oneOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }]
        storefront:
          $ref: "#/components/schemas/StorefrontConfiguration"

    Artist:
      type: object
      description: |
        A visible artist of the studio (TAT-44). Every property is always
        there. All text is plain text: render it as text.
      required: [id, slug, name, bio, photo, acceptingInquiries, closedMessage, workPhotos, styles, socialLinks]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: What `createInquiry` takes as `preferredArtistId`
        slug:
          type: string
          description: The artist's own link within the studio (`getArtist`)
        name: { type: string, maxLength: 120 }
        bio: { type: [string, "null"], maxLength: 1000 }
        photo:
          description: At most 2048 px on its longer side, or null
          oneOf: [{ $ref: "#/components/schemas/Photo" }, { type: "null" }]
        acceptingInquiries:
          type: boolean
          description: |
            False while the artist's books are closed: an inquiry naming
            them is the 409 `artist_not_accepting`.
        closedMessage:
          type: [string, "null"]
          maxLength: 300
          description: The artist's words to show instead of the inquiry form; null while they accept inquiries
        workPhotos:
          type: array
          maxItems: 6
          description: |
            The artist's six newest photos, newest first; [] when none. An
            artist who is closed for inquiries still shows theirs. All of them
            are in `listWork`.
          items: { $ref: "#/components/schemas/WorkPhoto" }
        styles:
          type: array
          maxItems: 5
          description: The artist's styles from the platform's list, in the list's order; [] when none.
          items: { $ref: "#/components/schemas/TattooStyle" }
        socialLinks:
          type: array
          description: "The links the artist set, in this order: instagram, facebook, tiktok. Only https links."
          items: { $ref: "#/components/schemas/SocialLink" }

    Service:
      type: object
      required: [id, name, durationMinutes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        durationMinutes: { type: integer, description: Estimated duration }
        startingPrice:
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]

    PortfolioProject:
      type: object
      required: [id, artistId, title, images]
      properties:
        id: { type: string, format: uuid }
        artistId: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        style: { type: [string, "null"], description: Style slug }
        placement: { type: [string, "null"], description: Placement slug }
        completedOn: { type: [string, "null"], format: date }
        images:
          type: array
          items: { $ref: "#/components/schemas/Image" }

    Slot:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

    SourceChannel:
      type: string
      description: How the person found the studio
      enum: [instagram, facebook, tiktok, google, friend, other]

    InquiryInput:
      type: object
      description: |
        An inquiry's text fields, kept exactly as sent (trimmed). The
        lengths are the most the API takes. Leave an optional field out, or
        empty, for none.
      required: [idea, placement, approximateSize, preferredDates, sourceChannel, contactName, contactPhone]
      properties:
        idea: { type: string, minLength: 1, maxLength: 4000, examples: [A fine-line peony with two leaves] }
        placement: { type: string, minLength: 1, maxLength: 120, examples: [Left forearm] }
        approximateSize: { type: string, minLength: 1, maxLength: 120, examples: [About 10 cm] }
        preferredDates: { type: string, minLength: 1, maxLength: 500, examples: [Any weekday in November] }
        preferredArtistId:
          type: [string, "null"]
          format: uuid
          description: A visible artist of this studio who takes inquiries. Leave it out for any artist.
        budget: { type: [string, "null"], maxLength: 120, description: Free text, examples: [NPR 15000] }
        sourceChannel: { $ref: "#/components/schemas/SourceChannel" }
        contactName: { type: string, minLength: 1, maxLength: 120 }
        contactPhone:
          type: string
          minLength: 1
          maxLength: 40
          description: The person's WhatsApp or Viber number, as typed. A number without a country code is read as Nepali; it is stored in E.164.
          examples: ["9812345678", "+977 981-234-5678"]
        contactEmail: { type: [string, "null"], format: email, maxLength: 254 }

    InquiryForm:
      description: The multipart body of `createInquiry`
      allOf:
        - $ref: "#/components/schemas/InquiryInput"
        - type: object
          properties:
            referenceImages:
              type: array
              maxItems: 5
              description: Up to 5 JPEG, PNG or WebP images, 10 MB each and 20 MB together, each its own `referenceImages` part. Their metadata (EXIF, GPS) is removed, and only the studio sees them.
              items: { type: string, format: binary }
            website:
              type: string
              maxLength: 0
              description: A honeypot that people never see. Leave it out or empty; any other value is refused as `challenge_failed`. (The bot-challenge token goes in the `X-Challenge-Token` header; a `challengeToken` field is ignored.)

    InquiryReceipt:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: The new inquiry. Nothing in the public API reads it back. }

    DepositState:
      type: string
      description: |
        What the deposit page says: `due` (pay, then send a screenshot),
        `submitted` (a screenshot waits for the studio), `paid` (nothing
        left to pay), `updating` (the studio is changing the quote),
        `expired` (the quote expired) or `cancelled`.
      enum: [due, submitted, paid, updating, expired, cancelled]

    DepositPaymentMethod:
      type: object
      required: [kind, label, qrImageUrl, accountName, accountNumber, bankName]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [fonepay, esewa, khalti, bank]
        label: { type: string, examples: [eSewa] }
        qrImageUrl:
          type: [string, "null"]
          format: uri
          description: The studio's QR code, a public image.
        accountName: { type: [string, "null"] }
        accountNumber:
          type: [string, "null"]
          description: The bank account number, or the eSewa or Khalti ID.
        bankName: { type: [string, "null"] }

    DepositPage:
      type: object
      required: [studio, project, deposit, referenceCode, state, lastProofRejected, proofSubmittedAt, paymentMethods, depositPolicy, nextSession]
      additionalProperties: false
      properties:
        studio:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name: { type: string }
        project:
          type: object
          required: [brief, artistName]
          additionalProperties: false
          properties:
            brief: { type: string }
            artistName: { type: [string, "null"] }
        deposit:
          type: object
          required: [amount, amountText, due, dueText, currency, payBy, payByText]
          additionalProperties: false
          properties:
            amount:
              type: integer
              minimum: 0
              description: The current quote's deposit, in paisa.
            amountText: { type: string, examples: ["NPR 3,000"] }
            due:
              type: integer
              minimum: 0
              description: What is still to pay, in paisa. Send it back as `expectedAmount`.
            dueText: { type: string, examples: ["NPR 3,000"] }
            currency: { type: string, examples: [NPR] }
            payBy:
              type: string
              format: date
              description: The quote's last valid day, in the studio's timezone.
            payByText: { type: string, examples: ["28 Oct 2026"] }
        referenceCode:
          type: string
          pattern: "^[2-9ABCDEFGHJKMNPQRSTVWXYZ]{6}$"
          description: What the client writes in the payment remark.
          examples: [7K3M9Q]
        state: { $ref: "#/components/schemas/DepositState" }
        lastProofRejected:
          type: boolean
          description: In `due`, the studio couldn't confirm the last screenshot.
        proofSubmittedAt:
          type: [string, "null"]
          format: date-time
          description: When the screenshot that waits was sent.
        paymentMethods:
          type: array
          description: The studio's payment methods, only in `due`; empty otherwise.
          items: { $ref: "#/components/schemas/DepositPaymentMethod" }
        depositPolicy:
          type: [string, "null"]
          description: The studio's own words about deposits.
        nextSession:
          description: Once the deposit is paid, the project's next session; null in every other state and when none is scheduled.
          oneOf: [{ $ref: "#/components/schemas/DepositSession" }, { type: "null" }]

    DepositSession:
      type: object
      description: |
        The project's earliest session that is still scheduled and hasn't
        ended, of any kind (TAT-110).
      required: [startsAt, artistName]
      additionalProperties: false
      properties:
        startsAt:
          type: string
          format: date-time
          description: When it starts, as a UTC instant. Show it in the studio's `timezone` (getStudio).
          examples: ["2026-10-24T05:15:00.000Z"]
        artistName:
          type: [string, "null"]
          description: The session's own artist; null when that profile was deleted.

    DepositProofForm:
      type: object
      description: The multipart body of `submitDepositProof`
      required: [proof, method, expectedAmount]
      properties:
        proof:
          type: string
          format: binary
          description: The payment screenshot (JPEG, PNG or WebP, 10 MB at most). Its metadata is removed, and only the studio sees it.
        method:
          type: string
          enum: [fonepay, esewa, khalti, bank]
          description: How the client paid, one of the page's `paymentMethods` kinds.
        expectedAmount:
          type: integer
          minimum: 1
          description: The `deposit.due` the page showed, in paisa.
