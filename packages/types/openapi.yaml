openapi: 3.1.0
info:
  title: Tattoo Drip public API
  version: 1.0.0-draft
  description: |
    Public storefront API. This document is the source of truth for
    `@tattoo-drip/types` and `@tattoo-drip/sdk`. Changes within v1 must be additive.

    Conventions for every endpoint (TAT-32):

    - **Stateless and cookieless.** No session and no CSRF token; no
      response ever sets a cookie.
    - **CORS** allows the platform's own browser origins, never with
      credentials: every studio page, the dashboard and Discover. An allowed
      `Origin` is echoed in `Access-Control-Allow-Origin` (never `*`), and
      every response carries `Vary: Origin`; GET, HEAD, POST, PUT and DELETE
      with the `Accept`, `Content-Type`, `X-Challenge-Token` and
      `X-Review-Token` request headers.
      `Retry-After` is readable. A server-side caller sends no `Origin` and
      needs no CORS.
    - **Tenant from the path.** Tenant endpoints live under
      `/tenants/{tenant}`; the slug is matched exactly, never case-folded.
    - **Envelopes.** A success body is `{ "data": … }`; an error body is
      `{ "error": { "code", "message", "fields"? } }` (`ErrorResponse`). A
      path that exists answers other methods with 405 and `Allow`.
    - **Caching.** Reads that say so send
      `Cache-Control: public, max-age=60, stale-while-revalidate=600`
      (Discover: `stale-while-revalidate=60`) and an
      `ETag` (`If-None-Match` gets a 304). Everything else, errors included,
      is `Cache-Control: no-store`.
    - **Rate limits (TAT-38).** Every request counts against its caller
      before its body is read, reads and writes apart; reads also count per
      studio. Over a limit the answer is 429 `rate_limited` with
      `Retry-After` (seconds). A response served from a cache is not
      counted. Never retry a write automatically.
    - **Busy and slow uploads (TAT-38).** A write may be 503
      `service_busy` with `Retry-After` while too many uploads are in
      progress (429 `rate_limited` for one address); an upload whose body
      takes longer than 90 seconds is 408 `request_timeout`.
    - **Server key.** The hosted storefront's server sends a secret key
      (`Authorization: Bearer`) and its visitor's address (`X-Visitor-IP`)
      so that its server-side calls count per visitor. The key grants no
      data and no access: every endpoint answers the same without it. It
      is an operational header, not an authentication scheme; never send it
      from a browser (CORS allows neither header).
servers:
  - url: https://api.example.com/api/v1

tags:
  - name: MVP
    description: What the pilot's studio page uses.
  - name: Discover
    description: The public, cross-studio Discover API (docs/discover/api.md). No tenant; reads only what listed studios publish.
  - name: V1
    description: Planned for the paid launch (docs/requirements.md, V1). Not implemented; the shapes may still change.
  - name: Reviews
    description: |
      The client's review page (Reviews and Fresh ink, slice 1): a review and
      a Fresh ink post through the private link a studio sends after a
      project. Behind a feature flag until the client content terms are
      reviewed: while it is off every review page operation is a 404. The
      link's token travels in the `X-Review-Token` header, never in a URL.
      And what the studio's own page shows of them (slice 3): `listReviews`
      and `listFreshInk`, which answer an empty page while the flag is off.

paths:
  /styles:
    get:
      operationId: listStyles
      tags: [MVP]
      summary: Platform-wide tattoo styles
      description: The platform's fixed list of tattoo styles, in its order. Cacheable.
      responses:
        "200":
          description: Styles
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/TattooStyle" } }
        "304": { $ref: "#/components/responses/NotModified" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/studios:
    get:
      operationId: listDiscoverStudios
      tags: [Discover]
      summary: Discover's listed studios, a page at a time
      description: |
        Studios (not independent artists: see `listDiscoverArtists`) whose
        owners listed them on Discover, that are not taken down. Under no
        studio and with no session. The filters combine; one that matches
        nothing is an empty page. Cacheable for a minute (and a minute
        stale): a studio that stops listing leaves the answers within two.
        A request with `q` also counts against a smaller search limit.
      parameters:
        - $ref: "#/components/parameters/DiscoverQuery"
        - $ref: "#/components/parameters/DiscoverCountry"
        - $ref: "#/components/parameters/DiscoverCity"
        - $ref: "#/components/parameters/DiscoverStyle"
        - $ref: "#/components/parameters/DiscoverSort"
        - $ref: "#/components/parameters/DiscoverCursor"
        - $ref: "#/components/parameters/DiscoverLimit"
      responses:
        "200":
          description: A page of studios
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                additionalProperties: false
                properties:
                  data: { type: array, maxItems: 48, items: { allOf: [{ $ref: "#/components/schemas/DiscoverStudioSummary" }], unevaluatedProperties: false } }
                  nextCursor: { $ref: "#/components/schemas/DiscoverNextCursor" }
        "304": { $ref: "#/components/responses/NotModified" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/studios/{studio}:
    parameters:
      - $ref: "#/components/parameters/DiscoverStudio"
    get:
      operationId: getDiscoverStudio
      tags: [Discover]
      summary: One listed studio, with its artists and newest photos
      description: |
        By its current slug or an old one (the answer names the current
        `slug`: link to that). A studio that is not listed, taken down,
        deleted, unknown, or an independent artist (`getDiscoverIndependentArtist`)
        is the same 404. Cacheable like the list.
      responses:
        "200":
          description: The studio
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/DiscoverStudioDetail" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/studios/{studio}/artists:
    parameters:
      - $ref: "#/components/parameters/DiscoverStudio"
    get:
      operationId: listDiscoverStudioArtists
      tags: [Discover]
      summary: A listed studio's artists on Discover, by name
      description: Every shown artist of the studio (at most 100), by name. 404 like `getDiscoverStudio`.
      responses:
        "200":
          description: The artists
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { type: array, maxItems: 100, items: { allOf: [{ $ref: "#/components/schemas/DiscoverArtistSummary" }], unevaluatedProperties: false } }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/studios/{studio}/artists/{artist}:
    parameters:
      - $ref: "#/components/parameters/DiscoverStudio"
      - $ref: "#/components/parameters/ArtistSlug"
    get:
      operationId: getDiscoverStudioArtist
      tags: [Discover]
      summary: One artist at a listed studio
      description: |
        An artist's slug is unique per studio only, so the studio's slug
        comes first. An artist who opted out of Discover, is hidden on the
        studio page or deleted, an unknown one, and any artist of a studio
        that is not shown are the same 404.
      responses:
        "200":
          description: The artist
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/DiscoverArtistDetail" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/studios/{studio}/reviews:
    parameters:
      - $ref: "#/components/parameters/DiscoverStudio"
    get:
      operationId: listDiscoverStudioReviews
      tags: [Discover]
      summary: A listed studio's client reviews on Discover, newest first
      description: |
        Reviews and Fresh ink (slice 4): the reviews the studio's clients
        wrote through its review link and allowed on Discover, that the
        client has not deleted and TattooDrip has not taken down, for a
        tattoo by an artist the studio shows on Discover. Newest first,
        never "best first", a page at a time. `rating` is the average and
        count of all of them, only from 3 (ruling 10); below that it is null:
        list the reviews without an average. A studio that unlists takes
        every review off at once. While reviews are switched off on the
        platform the answer is an empty page with a null `rating`. 404 like
        `getDiscoverStudio`. Cacheable like every Discover read.
      parameters:
        - $ref: "#/components/parameters/DiscoverCursor"
        - $ref: "#/components/parameters/DiscoverLimit"
      responses:
        "200": { $ref: "#/components/responses/DiscoverReviewsPage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/studios/{studio}/fresh-ink:
    parameters:
      - $ref: "#/components/parameters/DiscoverStudio"
    get:
      operationId: listDiscoverStudioFreshInk
      tags: [Discover]
      summary: A listed studio's Fresh ink on Discover, newest first
      description: |
        Reviews and Fresh ink (slice 4): the studio's Fresh ink posts on
        Discover (see `listDiscoverFreshInk`), newest published first, a page
        at a time. 404 like `getDiscoverStudio`; an empty page while reviews
        are switched off.
      parameters:
        - $ref: "#/components/parameters/DiscoverCursor"
        - $ref: "#/components/parameters/DiscoverLimit"
      responses:
        "200": { $ref: "#/components/responses/DiscoverFreshInkPage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/studios/{studio}/artists/{artist}/reviews:
    parameters:
      - $ref: "#/components/parameters/DiscoverStudio"
      - $ref: "#/components/parameters/ArtistSlug"
    get:
      operationId: listDiscoverStudioArtistReviews
      tags: [Discover]
      summary: The reviews of an artist at a listed studio, newest first
      description: |
        As `listDiscoverStudioReviews`, for the reviews of tattoos by this
        artist; `rating` is the artist's own, only from 3. 404 like
        `getDiscoverStudioArtist`.
      parameters:
        - $ref: "#/components/parameters/DiscoverCursor"
        - $ref: "#/components/parameters/DiscoverLimit"
      responses:
        "200": { $ref: "#/components/responses/DiscoverReviewsPage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/studios/{studio}/artists/{artist}/fresh-ink:
    parameters:
      - $ref: "#/components/parameters/DiscoverStudio"
      - $ref: "#/components/parameters/ArtistSlug"
    get:
      operationId: listDiscoverStudioArtistFreshInk
      tags: [Discover]
      summary: The Fresh ink of an artist at a listed studio, newest first
      description: As `listDiscoverStudioFreshInk`, for this artist's tattoos. 404 like `getDiscoverStudioArtist`.
      parameters:
        - $ref: "#/components/parameters/DiscoverCursor"
        - $ref: "#/components/parameters/DiscoverLimit"
      responses:
        "200": { $ref: "#/components/responses/DiscoverFreshInkPage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/artists:
    get:
      operationId: listDiscoverArtists
      tags: [Discover]
      summary: Discover's artists, a page at a time
      description: |
        The shown artists of every listed business: studios' artists and
        independent artists (`independent`). Filters, cache and limits as
        `listDiscoverStudios`; a location is the artist's studio's.
      parameters:
        - $ref: "#/components/parameters/DiscoverQuery"
        - $ref: "#/components/parameters/DiscoverCountry"
        - $ref: "#/components/parameters/DiscoverCity"
        - $ref: "#/components/parameters/DiscoverStyle"
        - name: studio
          in: query
          description: Only this studio's artists (its current slug)
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$" }
        - name: independent
          in: query
          description: "`true`: only independent artists; `false`: only studios' artists. Leave it out for both."
          schema: { type: boolean }
        - $ref: "#/components/parameters/DiscoverSort"
        - $ref: "#/components/parameters/DiscoverCursor"
        - $ref: "#/components/parameters/DiscoverLimit"
      responses:
        "200":
          description: A page of artists
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                additionalProperties: false
                properties:
                  data: { type: array, maxItems: 48, items: { allOf: [{ $ref: "#/components/schemas/DiscoverArtistSummary" }], unevaluatedProperties: false } }
                  nextCursor: { $ref: "#/components/schemas/DiscoverNextCursor" }
        "304": { $ref: "#/components/responses/NotModified" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/artists/{artist}:
    parameters:
      - name: artist
        in: path
        required: true
        description: The independent artist's business slug (their studio page's)
        schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$" }
    get:
      operationId: getDiscoverIndependentArtist
      tags: [Discover]
      summary: One listed independent artist
      description: |
        A business of type `independent`, by its current or an old slug:
        its shown artist profile (the first made, if it has several). A
        studio's slug, and anything not shown, are the same 404.
      responses:
        "200":
          description: The artist
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/DiscoverArtistDetail" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/tattoos:
    get:
      operationId: listDiscoverTattoos
      tags: [Discover]
      summary: Discover's tattoo photos, newest first, a page at a time
      description: |
        The published photos of every shown artist of every listed business,
        newest first. Never a photo the studio unpublished or Discover took
        down. Filters, cache and limits as `listDiscoverStudios`; a search
        (`q`, D09) counts against the same search budget.
      parameters:
        - name: q
          in: query
          description: |
            Photos whose alt text, artist's name, studio's (or independent
            artist's business's) name or style name contains this text, whatever
            its case (2 to 80 characters, no control characters). Newest first,
            like every page.
          schema: { type: string, minLength: 2, maxLength: 80 }
        - $ref: "#/components/parameters/DiscoverCountry"
        - $ref: "#/components/parameters/DiscoverCity"
        - $ref: "#/components/parameters/DiscoverStyle"
        - name: studio
          in: query
          description: Only this business's photos (its current slug)
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$" }
        - name: artist
          in: query
          description: Only this artist's photos (their `id`)
          schema: { type: string, format: uuid }
        - name: healed
          in: query
          description: "`true`: only photos marked healed. `false` is the same as leaving it out."
          schema: { type: boolean }
        - $ref: "#/components/parameters/DiscoverCursor"
        - $ref: "#/components/parameters/DiscoverLimit"
      responses:
        "200":
          description: A page of photos
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                additionalProperties: false
                properties:
                  data: { type: array, maxItems: 48, items: { allOf: [{ $ref: "#/components/schemas/DiscoverTattooSummary" }], unevaluatedProperties: false } }
                  nextCursor: { $ref: "#/components/schemas/DiscoverNextCursor" }
        "304": { $ref: "#/components/responses/NotModified" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/tattoos/{tattoo}:
    parameters:
      - name: tattoo
        in: path
        required: true
        description: A photo's `id`
        schema: { type: string, format: uuid }
    get:
      operationId: getDiscoverTattoo
      tags: [Discover]
      summary: One published tattoo photo
      description: |
        The photo, where it is on the studio's page and how to ask for one
        like it. Anything not shown is a 404. A tattoo is listed once, as its
        main photo; the id of one of its other photos answers with the
        tattoo, whose `id` is then the main photo's: send the visitor there
        with a temporary redirect (which photo leads a tattoo can change).
      responses:
        "200":
          description: The photo
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/DiscoverTattooDetail" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/artists/{artist}/reviews:
    parameters:
      - name: artist
        in: path
        required: true
        description: The independent artist's business slug (their studio page's)
        schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$" }
    get:
      operationId: listDiscoverIndependentArtistReviews
      tags: [Discover]
      summary: A listed independent artist's reviews, newest first
      description: |
        As `listDiscoverStudioArtistReviews`, for the artist profile
        `getDiscoverIndependentArtist` answers. 404 like it.
      parameters:
        - $ref: "#/components/parameters/DiscoverCursor"
        - $ref: "#/components/parameters/DiscoverLimit"
      responses:
        "200": { $ref: "#/components/responses/DiscoverReviewsPage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/artists/{artist}/fresh-ink:
    parameters:
      - name: artist
        in: path
        required: true
        description: The independent artist's business slug (their studio page's)
        schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$" }
    get:
      operationId: listDiscoverIndependentArtistFreshInk
      tags: [Discover]
      summary: A listed independent artist's Fresh ink, newest first
      description: As `listDiscoverStudioArtistFreshInk`, for the artist profile `getDiscoverIndependentArtist` answers. 404 like it.
      parameters:
        - $ref: "#/components/parameters/DiscoverCursor"
        - $ref: "#/components/parameters/DiscoverLimit"
      responses:
        "200": { $ref: "#/components/responses/DiscoverFreshInkPage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/fresh-ink:
    get:
      operationId: listDiscoverFreshInk
      tags: [Discover]
      summary: Discover's Fresh ink feed, newest first, a page at a time
      description: |
        Reviews and Fresh ink (slice 4): healed tattoos clients of listed
        businesses posted through the studio's review link, that the studio
        approved and the client allowed on Discover, published and not
        taken down, by an artist shown on Discover. Newest published first
        (never ranked). The filters combine as `listDiscoverTattoos`'s: one
        that matches nothing is an empty page. Each post names its studio's
        slug (its Discover profile) and carries the studio's booking link
        and page, as an artwork does. A studio that unlists takes every post
        off at once. While reviews are switched off on the platform the
        answer is an empty page. Cacheable like every Discover read.
      parameters:
        - $ref: "#/components/parameters/DiscoverCountry"
        - $ref: "#/components/parameters/DiscoverCity"
        - $ref: "#/components/parameters/DiscoverStyle"
        - $ref: "#/components/parameters/DiscoverCursor"
        - $ref: "#/components/parameters/DiscoverLimit"
      responses:
        "200": { $ref: "#/components/responses/DiscoverFreshInkPage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/styles:
    get:
      operationId: listDiscoverStyles
      tags: [Discover]
      summary: The styles Discover filters by
      description: The platform's fixed list of styles (`listStyles`), in its order. Cacheable.
      responses:
        "200":
          description: Styles
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/TattooStyle" } }
        "304": { $ref: "#/components/responses/NotModified" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /discover/locations:
    get:
      operationId: listDiscoverLocations
      tags: [Discover]
      summary: The places Discover's businesses are in
      description: The places at least one listed business names, by country and name. No counts. Cacheable.
      responses:
        "200":
          description: Places
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DiscoverLocation" } }
        "304": { $ref: "#/components/responses/NotModified" }
