  /tenants/{tenant}/inquiries:
    parameters:
      - $ref: "#/components/parameters/Tenant"
    post:
      operationId: createInquiry
      tags: [MVP]
      summary: Send the studio an inquiry, with reference images
      parameters:
        - $ref: "#/components/parameters/ChallengeToken"
      description: |
        No account needed. One `multipart/form-data` request with the fields
        and up to 5 reference images (JPEG, PNG or WebP, 10 MB each and
        20 MB for the whole request); any other body is a 415. The studio
        finds the person by phone; the answer is the same whether or not it
        knew the number, and says nothing but the new inquiry's id. Never
        cached. Under an old slug it is a 404: send it to the current slug,
        which `getStudio` names.

        Own codes (409): `artist_not_accepting` (the chosen artist takes no
        new inquiries), `studio_not_accepting` (no artist chosen, and every
        artist of the studio is closed), `too_many_open_inquiries` (this
        phone number already has 3 inquiries the studio hasn't answered).
        A request for a flash design (`flashDesignId`) is also a 409
        `flash_unavailable` when the design is hidden, its artist is hidden
        or deleted, or the id is unknown, and `flash_claimed` when the design
        was one of a kind and someone has claimed it (the studio shows or
        hides claimed designs: either way it takes no request; offer to ask
        for something similar as a plain request); a request for a design whose artist
        takes no flash requests is `artist_not_accepting`, though their books
        may be open. A `preferredArtistId` other than the design's artist is
        `validation_failed` on `preferredArtistId`.
        An unknown or hidden `preferredArtistId` is `validation_failed` on
        `preferredArtistId`; a `style` that isn't on `listStyles`, a `colour`
        other than the three listed and `notes` over 1000 characters are each
        `validation_failed` on that field; an image that isn't a JPEG, PNG or WebP is
        `validation_failed` on `referenceImages.<index>`.

        Abuse protection (TAT-55): send the bot-challenge token in
        `X-Challenge-Token` and leave the honeypot field `website` out. A
        missing, invalid, expired or reused token, or a filled `website`, is
        403 `challenge_failed`; when the API can't check the token it is 503
        `challenge_unavailable`. Requests are rate-limited per address, per
        studio and per phone number (429 `rate_limited` with `Retry-After`,
        up to a day for one phone number).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/InquiryForm" }
            encoding:
              referenceImages:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "201":
          description: Received. The studio replies on WhatsApp or Viber; the answer carries the request's reference.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/InquiryReceipt" }
        "400": { $ref: "#/components/responses/Error" }
        "403":
          description: The bot challenge failed (`challenge_failed`). Get a new token and send again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/Error" }
        "409":
          description: The studio takes no such inquiry now (`artist_not_accepting`, `studio_not_accepting`, `too_many_open_inquiries`, `flash_unavailable`, `flash_claimed`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: The bot challenge could not be checked (`challenge_unavailable`), or the API is busy (`service_busy`, with `Retry-After`). Try again in a minute.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }

  /tenants/{tenant}/deposits/{token}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/DepositToken"
    get:
      operationId: getDeposit
      tags: [MVP]
      summary: A project's deposit page, through its link
      description: |
        What the client's deposit page shows: the studio, the project's
        brief, the deposit, the reference code to write in the payment
        remark, the studio's payment methods (only while the deposit is
        due), its deposit policy, and once it is paid, the project's next
        session. Never cached. Every link that doesn't
        work (unknown, replaced, expired, another studio's, or its project
        gone) is the same 404. Rate-limited per address and per link.
      responses:
        "200":
          description: The deposit page
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/DepositPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: submitDepositProof
      tags: [MVP]
      summary: Send a screenshot of the deposit payment
      description: |
        One `multipart/form-data` request: the screenshot (`proof`, a JPEG,
        PNG or WebP of 10 MB at most), how the client paid (`method`, one of
        the page's `paymentMethods` kinds) and the amount the page showed
        (`expectedAmount`, its `deposit.due`). The API keeps the image
        privately, records a payment for the studio to check, and answers
        with the page as it now is (`submitted`). One screenshot waits at a
        time. Under an old slug it is a 404. Rate-limited per address and
        per link.

        Own codes (409): `deposit_not_due` (the page's state isn't `due`, for
        example a screenshot already waits; reload the page) and
        `deposit_changed` (`expectedAmount` isn't what is due now; reload
        the page).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/DepositProofForm" }
            encoding:
              proof:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "201":
          description: Received. The studio checks it and confirms on WhatsApp or Viber.
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/DepositPage" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/Error" }
        "409":
          description: The page can't take a screenshot now (`deposit_not_due`, `deposit_changed`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: The API is busy (`service_busy`, with `Retry-After`). Try again in a moment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }

  /tenants/{tenant}/deposits/{token}/checkout:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/DepositToken"
    post:
      operationId: startDepositCheckout
      tags: [V1]
      summary: Pay the deposit online
      description: |
        Starts (or reuses) a PayBridgeNP hosted checkout for the deposit
        still due, paid to the studio's own eSewa, Khalti or Fonepay
        merchant accounts (docs/payments-paybridgenp.md). Send no body: the
        amount is the deposit still due, read by the API; the client never
        sends one. Open the answer's `checkoutUrl` in the same tab. Coming
        back from it proves nothing: reload the deposit page, whose
        `onlinePayment.checkout` says `confirming` until the studio's
        payment provider confirms the payment to the API, then `paid`.
        Only while `onlinePayment.available` is true. Under an old slug it
        is a 404. Rate-limited per address and per link.

        Own codes: `online_payment_unavailable` (409: the studio doesn't
        take online payments, the page's state isn't `due`, or the amount
        is outside NPR 10 to NPR 10,00,000), `online_payment_in_progress`
        (409: the previous online payment is still on the provider's page or
        was just paid; never offer to pay again, reload later) and
        `payment_provider_unavailable` (503: the provider didn't answer;
        nothing was charged, try again).
      responses:
        "201":
          description: The checkout to open
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/DepositCheckout" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Online payment isn't available for this deposit now (`online_payment_unavailable`, `online_payment_in_progress`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: The payment provider or the API is busy (`payment_provider_unavailable`, `service_busy`). Try again in a moment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }

  /tenants/{tenant}/review:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/ReviewToken"
    get:
      operationId: getReviewPage
      tags: [Reviews]
      summary: The client's review page, through its link
      description: |
        What the client's review page shows: the studio, the artist and the
        day of the tattoo, the styles the post may carry, the defaults
        (the shown name, the project's style and placement), and what the
        client has written and posted. Never cached. Every link that doesn't
        work (unknown, revoked, expired, another studio's, or its project
        gone) is the same 404, and so is every operation while reviews are
        off. Rate-limited per address and per link.
      responses:
        "200":
          description: The review page
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/ReviewPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: submitReviewPage
      tags: [Reviews]
      summary: Write or change the review and the Fresh ink post
      description: |
        The client's submit: the shown name and the two consents, which apply
        to the review and the post alike, with the review (`review`), the
        post (`post`) or both; a part left out stays as it is. A review is
        made or changed; a post (whose photos and videos were added first)
        is handed to the studio, which approves it before it shows anywhere.
        Every field is checked again here. While `studio.onDiscover` is false,
        `consentDiscover` can only be withdrawn (the stored choice and the
        sent one must both be true to stay true).
        Needs the bot-challenge token in `X-Challenge-Token` (action
        `review`), as the intake does. Answers with the page as it now is.
        Under an old slug it is a 404.

        Own codes: `review_locked` (409: what TattooDrip took down, or a post
        the studio declined or unpublished, can't be changed; its consents,
        its name and its delete still work), `taken_down` (409: a new review
        after TattooDrip took the last one down), `post_needs_photo` (409: a
        video can't lead), `challenge_failed` (403) and
        `challenge_unavailable` (503).
      parameters:
        - $ref: "#/components/parameters/ChallengeToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewSubmission" }
      responses:
        "200": { $ref: "#/components/responses/ReviewPageResponse" }
        "403":
          description: The bot challenge failed (`challenge_failed`). Get a new token and send again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: It can't be changed now (`review_locked`, `taken_down`, `post_needs_photo`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: The bot challenge could not be checked (`challenge_unavailable`), or the API is busy (`service_busy`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }

  /tenants/{tenant}/review/review:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/ReviewToken"
    delete:
      operationId: deleteReview
      tags: [Reviews]
      summary: Delete the client's review
      description: |
        Takes the review off every surface at once; the client can write a
        new one through the link. Deleting what isn't there is no error.
        Answers with the page as it now is.
      responses:
        "200": { $ref: "#/components/responses/ReviewPageResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /tenants/{tenant}/review/post:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/ReviewToken"
    delete:
      operationId: deleteReviewPost
      tags: [Reviews]
      summary: Delete the client's Fresh ink post
      description: |
        Deletes the post with every photo and video (their files first, so
        none stays reachable). Deleting what isn't there is no error.
        Answers with the page as it now is. Own code: `remove_failed` (503:
        a file couldn't be deleted; nothing was; try again).
      responses:
        "200": { $ref: "#/components/responses/ReviewPageResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: A file couldn't be deleted (`remove_failed`). Try again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }

  /tenants/{tenant}/review/post/order:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/ReviewToken"
    put:
      operationId: reorderReviewPost
      tags: [Reviews]
      summary: Change the order of the post's photos and videos
      description: |
        The post's order alone ("Make photo 3 the main photo"): every
        `ReviewMedia` id once, a photo first. Nothing else is written and no
        bot challenge is needed. A change to an approved post sends it back
        to the studio. Answers with the page as it now is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              additionalProperties: false
              properties:
                order: { type: array, minItems: 1, maxItems: 8, items: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/ReviewPageResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not changeable or a video first (`review_locked`, `post_needs_photo`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /tenants/{tenant}/review/photos:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/ReviewToken"
    post:
      operationId: addReviewPhoto
      tags: [Reviews]
      summary: Add a photo to the Fresh ink post
      description: |
        One `multipart/form-data` request with one photo (`photo`, a JPEG,
        PNG or WebP of 10 MB at most). It becomes the post's last item; the
        first photo leads. A post that doesn't exist yet is started (a draft
        only the client sees until the submit). Own codes (409): `post_full`
        (8 photos and videos already), `review_locked`, `taken_down` and
        `post_limit` (a new post after a takedown, or a third one). Answers
        with the page as it now is.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ReviewPhotoForm" }
            encoding:
              photo:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "201": { $ref: "#/components/responses/ReviewPageResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/Error" }
        "409":
          description: No room or not changeable (`post_full`, `review_locked`, `taken_down`, `post_limit`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /tenants/{tenant}/review/videos/sign:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/ReviewToken"
    post:
      operationId: signReviewVideo
      tags: [Reviews]
      summary: Get where to upload a video for the Fresh ink post
      description: |
        A video never goes through the API's request body: say its type and
        exact length, PUT the file to `upload.url` (resolve it against the
        API's origin: it is absolute in production, a path on the API in
        development) with `upload.headers`, then send `token` to
        `addReviewVideo`. MP4, MOV or WebM, at most 100 MB; the API measures
        the rest (60 seconds at most, 4K at most) and strips the sound. The
        post needs a photo first (`post_needs_photo`, 409: a video never
        leads); `post_full` and `review_locked` as for a photo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewVideoSignInput" }
      responses:
        "200":
          description: Where to upload
          headers:
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                additionalProperties: false
                properties:
                  data: { $ref: "#/components/schemas/ReviewVideoUpload" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No room, no photo yet, or not changeable (`post_full`, `post_needs_photo`, `review_locked`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /tenants/{tenant}/review/videos:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/ReviewToken"
    post:
      operationId: addReviewVideo
      tags: [Reviews]
      summary: Add an uploaded video to the Fresh ink post
      description: |
        Once the PUT has finished: the video becomes the post's last item,
        `processing`, then `ready` or `failed` (read the page again to
        follow it). An upload that didn't arrive, isn't this link's or was
        added already is `validation_failed` on `upload`. Answers with the
        page as it now is.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewVideoFinishInput" }
      responses:
        "201": { $ref: "#/components/responses/ReviewPageResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: No room, no photo, or not changeable (`post_full`, `post_needs_photo`, `review_locked`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /tenants/{tenant}/review/media/{media}:
    parameters:
      - $ref: "#/components/parameters/Tenant"
      - $ref: "#/components/parameters/ReviewToken"
      - name: media
        in: path
        required: true
        description: A `ReviewMedia` id of this link's post.
        schema: { type: string, format: uuid }
    delete:
      operationId: removeReviewMedia
      tags: [Reviews]
      summary: Remove a photo or video from the Fresh ink post
      description: |
        Its files are deleted first, so it stops loading at once. The first
        photo left leads. Own codes: `post_needs_photo` (409: the last photo
        can't go while a video stays; remove the videos first),
        `review_locked` (409) and `remove_failed` (503). An id that isn't
        this link's post's is a 404. Answers with the page as it now is.
      responses:
        "200": { $ref: "#/components/responses/ReviewPageResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: It can't go now (`post_needs_photo`, `review_locked`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: A file couldn't be deleted (`remove_failed`). Try again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    Tenant:
      name: tenant
      in: path
      required: true
      description: |
        Tenant slug (also its subdomain), matched exactly: never case-folded.
        A tenant's old slugs answer reads (GET, HEAD) like its current slug,
        and the tenant resource names the current one. Any other method under
        an old slug is a 404, so writes must use the current slug.
      schema:
        type: string
        minLength: 3
        maxLength: 63
        pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
    DepositToken:
      name: token
      in: path
      required: true
      description: |
        The deposit link's secret: the fragment of the link the studio sent
        (`https://<studio>/deposit#<token>`). A bearer secret: never log it
        or send it to analytics.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
    ReviewToken:
      name: X-Review-Token
      in: header
      required: true
      description: |
        The review link's secret: the fragment of the link the studio sent
        (`https://<studio>/review#<token>`). Sent as a header so it never
        appears in a URL the API sees or logs. A bearer secret: never log
        it, put it in a URL or send it to analytics.
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
    ChallengeToken:
      name: X-Challenge-Token
      in: header
      required: true
      description: |
        The bot-challenge token the studio page's Cloudflare Turnstile widget
        made for this submission, rendered with the form's action (`inquiry`
        for an inquiry, `review` for the review page). Single-use:
        get a new one for every request, also after a refusal. Missing,
        invalid, expired, already used, or made on another page or for
        another form: 403 `challenge_failed`. A local development server
        without the challenge set up ignores it.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    ArtistSlug:
      name: artist
      in: path
      required: true
      description: |
        The artist's slug, matched exactly: never case-folded. An artist's
        old slug is not kept: after a change it is a 404.
      schema:
        type: string
        minLength: 2
        maxLength: 63
        pattern: "^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$"

    DiscoverStudio:
      name: studio
      in: path
      required: true
      description: A studio's slug, current or old
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$" }
    DiscoverQuery:
      name: q
      in: query
      description: Names containing this text, whatever its case (2 to 80 characters)
      schema: { type: string, minLength: 2, maxLength: 80 }
    DiscoverCountry:
      name: country
      in: query
      description: An ISO 3166-1 alpha-2 country code (`NP`), either case
      schema: { type: string, pattern: "^[A-Za-z]{2}$" }
    DiscoverCity:
      name: city
      in: query
      description: A city's `slug` (`listDiscoverLocations`); needs `country`
      schema: { type: string, maxLength: 63, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
    DiscoverStyle:
      name: style
      in: query
      description: A style's slug (`listDiscoverStyles`)
      schema: { type: string, maxLength: 40 }
    DiscoverSort:
      name: sort
      in: query
      description: "`newest` (the default: most recently listed, or added), `name` (A to Z) or `-name` (Z to A). Ties go by id."
      schema: { type: string, enum: [newest, name, -name], default: newest }
    DiscoverCursor:
      name: cursor
      in: query
      description: The previous page's `nextCursor`, as sent, with the same filters and sort
      schema: { type: string, maxLength: 1000, pattern: "^[A-Za-z0-9_-]+$" }
    DiscoverLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 48, default: 24 }
    DiscoverSitemapCursor:
      name: cursor
      in: query
      description: The previous page's `nextCursor`, as sent (the sitemap lists' keyset position)
      schema: { type: string, format: uuid }
    DiscoverSitemapLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 5000, default: 5000 }

  headers:
    CacheControl:
      description: "`public, max-age=60, stale-while-revalidate=600` on a cacheable read (`stale-while-revalidate=60` on Discover); `no-store` on everything else."
      schema: { type: string }
    ETag:
      description: Strong entity tag of the body. Send it back as `If-None-Match` to get a 304 while it still matches.
      schema: { type: string }
    RetryAfter:
      description: Seconds until another request may succeed.
      schema: { type: integer, minimum: 0 }

  responses:
    DiscoverReviewsPage:
      description: A page of reviews, and the average from 3
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema:
            type: object
            required: [data, nextCursor, rating]
            additionalProperties: false
            properties:
              data: { type: array, maxItems: 48, items: { $ref: "#/components/schemas/DiscoverReview" } }
              nextCursor: { $ref: "#/components/schemas/DiscoverNextCursor" }
              rating:
                description: |
                  The average and count of every review this list holds (not
                  just this page), the same on every page; null below 3.
                oneOf: [{ $ref: "#/components/schemas/ReviewRating" }, { type: "null" }]
    DiscoverFreshInkPage:
      description: A page of Fresh ink posts
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema:
            type: object
            required: [data, nextCursor]
            additionalProperties: false
            properties:
              data: { type: array, maxItems: 48, items: { $ref: "#/components/schemas/DiscoverFreshInkPost" } }
              nextCursor: { $ref: "#/components/schemas/DiscoverNextCursor" }
    ReviewPageResponse:
      description: The review page as it now is
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
      content:
        application/json:
          schema:
            type: object
            required: [data]
            additionalProperties: false
            properties:
              data: { $ref: "#/components/schemas/ReviewPage" }
    NotModified:
      description: The `If-None-Match` tag still matches; no body
      headers:
        Cache-Control: { $ref: "#/components/headers/CacheControl" }
        ETag: { $ref: "#/components/headers/ETag" }
    NotFound:
      description: Unknown tenant or resource, or a write under an old slug (`not_found`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: Invalid input (`validation_failed`, with `fields`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: Too many requests (`rate_limited`)
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Error:
      description: Any other error, with one of the codes `ErrorResponse` lists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: |
                Stable and machine-readable. Shared codes: `bad_request` (400,
                an unreadable body), `not_found` (404), `method_not_allowed`
                (405), `payload_too_large` (413), `unsupported_media_type`
                (415), `validation_failed` (422, with `fields`),
                `rate_limited` (429, with `Retry-After`), `internal_error`
                (500), `request_timeout` (408, an upload that took too long)
                and `service_busy` (503, with `Retry-After`: too many uploads
                in progress, or no database connection free). Endpoint codes: `artist_not_accepting`,
                `studio_not_accepting`, `too_many_open_inquiries`, `flash_unavailable`,
                `flash_claimed` (409),
                `challenge_failed` (403) and `challenge_unavailable` (503),
                all `createInquiry`; `deposit_not_due`, `deposit_changed`
                (409, `submitDepositProof`); `review_locked`, `post_full`,
                `post_needs_photo`, `taken_down`, `post_limit` (409) and
                `remove_failed` (503), the
                review page's (and `challenge_failed`,
                `challenge_unavailable` on `submitReviewPage`). Treat an
                unknown code by its HTTP status.
              examples: [not_found, validation_failed, rate_limited, service_busy, too_many_open_inquiries, flash_unavailable, flash_claimed, challenge_failed, deposit_changed]
            message:
              type: string
              description: A sentence for people. Never parse it.
            fields:
              type: object
              description: Field path (dot-separated, e.g. `contactPhone` or `referenceImages.0`) → messages. Only on `validation_failed`.
              additionalProperties: { type: array, items: { type: string } }

    TattooStyle:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, examples: [fine-line] }
        name: { type: string, examples: [Fine line] }

    BodyPlacement:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, examples: [forearm] }
        name: { type: string, examples: [Forearm] }

    Image:
      type: object
      required: [url, width, height, variants]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Public and absolute.
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        alt: { type: [string, "null"] }
        variants:
          type: array
          maxItems: 8
          description: |
            Smaller copies, narrowest first, each narrower than `width`. The
            widths depend on the kind of image: 320, 640 and 1280 px for
            photos, 640, 960, 1280 and 1600 px for a cover, only those below
            the image's own width. Empty for an image stored before them or too
            small to have any: then show `url` alone. Build `srcset` from
            these and `url` at `width`.
          items: { $ref: "#/components/schemas/ImageVariant" }

    Logo:
      type: object
      description: |
        The studio's logo (TAT-56) as an `Image` (`alt` is always null: it
        sits beside the studio's name; a PNG keeps its transparency), with the
        tile it sits on and its square icon (TAT-123).
      required: [url, width, height, alt, variants, tile, icon]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Public and absolute.
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        alt: { type: [string, "null"] }
        variants:
          type: array
          maxItems: 8
          description: |
            Smaller copies, narrowest first (320, 640 and 1280 px, those below
            the logo's own width), `[]` when it has none. Build `srcset` from
            these and `url` at `width`.
          items: { $ref: "#/components/schemas/ImageVariant" }
        tile:
          type: string
          enum: [light, dark]
          description: |
            The small tile the logo sits on, in both colour schemes: `light`
            (#f7f3ee) or `dark` (#14110f). Picked when the logo is uploaded (a
            light logo with a see-through background gets the dark one); the
            owner can change it. Treat an unknown value as `light`.
        icon:
          description: |
            A square copy of the logo for the browser tab and a phone's home
            screen, or null (a logo saved before TAT-123, or one whose icon
            could not be made): a 180 x 180 PNG of the logo on the tile picked
            at upload, never see-through, with its 32 px copy in `variants`.
            `alt` is always null.
          oneOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }]

    Photo:
      type: object
      description: |
        An artist's photo (TAT-44) and its smaller copies: an `Image`
        without `alt`, so every property is always there. The page builds the
        `alt` text from the artist's name.
      required: [url, width, height, variants]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Public and absolute.
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        variants:
          type: array
          maxItems: 8
          description: |
            Smaller copies, narrowest first, each narrower than `width`
            (320, 640 and 1280 px, those below the image's own width). Empty
            for an image stored before them or too small to have any: then
            show `url` alone. Build `srcset` from these and `url` at `width`.
          items: { $ref: "#/components/schemas/ImageVariant" }

    WorkPhoto:
      type: object
      description: |
        A photo of an artist's work (TAT-116) and its smaller copies. Every
        property is always there. It carries no id, key, styles, healed mark
        or timestamp: the list's order is newest first. An artist's
        `workPhotos` are tattoos' main photos; a `GalleryPhoto`'s `angles`
        are the rest of one tattoo, in order.
      required: [url, width, height, alt, variants]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Public and absolute.
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        alt:
          type: [string, "null"]
          maxLength: 200
          description: |
            The studio's own description of the photo, one line of plain
            text, or null: then build one from the artist's name, such as
            "Tattoo by Sita Rai, photo 2 of 4".
        variants:
          type: array
          maxItems: 8
          description: |
            Smaller copies, narrowest first, each narrower than `width`
            (320, 640 and 1280 px, those below the photo's own width). Empty
            for a photo too small to have any: then show `url` alone. Build
            `srcset` from these and `url` at `width`.
          items: { $ref: "#/components/schemas/ImageVariant" }

    ImageVariant:
      type: object
      description: |
        A smaller copy of an image (TAT-112), for `srcset`: the same picture
        in the same format, `width` px wide; its height keeps the image's
        aspect ratio.
      required: [url, width]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Absolute, on the same origin as the image's `url`.
        width: { type: integer, minimum: 1 }

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, description: Minor units (cents) }
        currency: { type: string, description: ISO 4217 code, examples: [USD] }

    SocialLink:
      type: object
      required: [platform, url]
      additionalProperties: false
      properties:
        platform:
          type: string
          description: |
            `instagram`, `facebook`, `tiktok` or `website` today. Show any
            other value as a plain link.
          examples: [instagram]
        url:
          type: string
          format: uri
          description: An https URL.

    StorefrontSection:
      description: |
        One section of the studio page (TAT-56). Show the sections in the
        order they are listed. Treat an unknown `type` as one to leave out.
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          description: |
            `work` (Recent work: the newest photos), `artists` (the artists
            list), `flash` (a few of the newest flash designs, shown only
            when there are some), `info` (Good to know: hours, closed days
            and what clients ask, shown only when the studio filled something
            in), `fresh_ink` (a few of the newest Fresh ink posts:
            clients' healed tattoos, shown only when there are some, from
            `listFreshInk`), `reviews` (the newest client reviews and, from 3
            reviews, the average, shown only when there are some, from
            `listReviews`) or
            `inquiry` (the "Got an idea?" invitation to the request page,
            always listed). More will come: treat an unknown value as one to
            leave out.
          type: string
          enum: [work, artists, flash, fresh_ink, reviews, info, inquiry]

    StorefrontConfiguration:
      description: |
        How the studio page looks (TAT-56): the owner's choices, as checked
        values only, never markup, CSS or scripts. Colours and fonts are
        applied by the page from fixed lists. Each value stands alone: a
        value you do not know falls back to its default and the rest still
        applies. A studio that set nothing gets the defaults.
      type: object
      required: [theme, branding, sections]
      additionalProperties: false
      properties:
        theme:
          description: |
            The studio's theme: `stencil-and-ink` (paper, ink and a violet
            stencil line), `ink-noir` (dark and photo-first, with a site
            navigation and a full footer), `irezumi` (light and editorial:
            warm paper, charcoal ink and a vermilion accent), `atelier`
            (quiet luxury: stone paper, bronze and Bodoni headings) or
            `flash-parlour` (a traditional walk-in shop's wall of flash:
            cream, black ink, red, mustard and green). More will come: treat
            an unknown value as `stencil-and-ink`.
          type: string
          enum: [stencil-and-ink, ink-noir, irezumi, atelier, flash-parlour]
        branding:
          type: object
          required: [logo, colors, font]
          additionalProperties: false
          properties:
            logo:
              description: |
                The studio's logo, or null. `alt` is always null (it sits
                beside the studio's name). A PNG keeps its transparency. It
                comes with the tile it sits on and its square icon (`Logo`).
              oneOf: [{ $ref: "#/components/schemas/Logo" }, { type: "null" }]
            colors:
              type: object
              required: [accent, accentDark]
              additionalProperties: false
              properties:
                accent:
                  description: |
                    The studio's colour for buttons, links and the frame
                    around photos, `#rrggbb` in lowercase, 4.5:1 or more on
                    `#f7f3ee`; null is the theme's own violet.
                  type: [string, "null"]
                  pattern: "^#[0-9a-f]{6}$"
                  examples: ["#0f766e"]
                accentDark:
                  description: |
                    The same for dark mode, 4.5:1 or more on `#14110f`; null
                    is a lighter shade of `accent` (or the theme's violet).
                  type: [string, "null"]
                  pattern: "^#[0-9a-f]{6}$"
                  examples: ["#a99cff"]
            font:
              description: |
                The face of the studio's name and headings, a key into the
                page's fixed list. More will come: treat an unknown value as
                `eczar`.
              type: string
              enum: [eczar, serif, sans]
        sections:
          description: |
            The sections to show, in order. The `inquiry` section (the
            "Got an idea?" invitation to the request page) is always listed.
          type: array
          minItems: 1
          maxItems: 7
          items: { $ref: "#/components/schemas/StorefrontSection" }

    Studio:
      type: object
      description: |
        A tenant's public profile (TAT-44): what its owners were told the
        studio page shows. Every property is always there; an empty one is
        `null` or `[]`. All text is plain text: render it as text, never as
        HTML.
      required: [slug, name, type, intro, timezone, contact, socialLinks, acceptingInquiries, cover, storefront, openingHours, closedDays, goodToKnow, faq, policies]
      additionalProperties: false
      properties:
        slug:
          type: string
          description: The current slug, also when the request used an old one
        name: { type: string, maxLength: 120 }
        type:
          type: string
          enum: [studio, independent]
          description: |
            `independent` is one artist working alone; their own profile is
            the studio's one artist.
        intro: { type: [string, "null"], maxLength: 1000 }
        timezone:
          type: string
          description: The IANA timezone of the studio's dates and times
          examples: [Asia/Kathmandu]
        contact:
          type: object
          required: [phone, email, address]
          additionalProperties: false
          properties:
            phone:
              type: [string, "null"]
              description: E.164
              examples: ["+9779812345678"]
            email:
              type: [string, "null"]
              format: email
              description: The studio's contact email
            address:
              type: [string, "null"]
              maxLength: 300
              description: Free text; keep its line breaks
        socialLinks:
          type: array
          description: |
            The links the studio set, in this order: instagram, facebook,
            tiktok, website. Only https links.
          items: { $ref: "#/components/schemas/SocialLink" }
        acceptingInquiries:
          type: boolean
          description: |
            Whether `createInquiry` takes an inquiry that names no artist.
            False only when every visible artist is closed (that inquiry
            would be the 409 `studio_not_accepting`); a studio with no
            visible artist takes general inquiries.
        cover:
          description: |
            The studio's cover photo (TAT-116), at most 2048 px on its longer
            side, with its smaller copies, or null. The studio page opens on
            it with the studio's name over it. `alt` is always null: the name
            over it says what the page is. It is the page's hero image; there
            is no other.
          oneOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }]
        storefront:
          $ref: "#/components/schemas/StorefrontConfiguration"
        openingHours:
          type: array
          maxItems: 7
          description: |
            The weekdays the studio opens (TAT-128), Sunday first; a weekday
            not listed is closed. [] when the studio set no hours.
          items: { $ref: "#/components/schemas/OpeningHours" }
        closedDays:
          type: array
          maxItems: 20
          description: |
            Closed days that haven't ended in the studio's timezone,
            earliest first (TAT-128). [] when there are none.
          items: { $ref: "#/components/schemas/ClosedDays" }
        goodToKnow:
          $ref: "#/components/schemas/GoodToKnow"
        faq:
          type: array
          maxItems: 20
          description: |
            The studio's own questions and answers, in its order. Show them
            after the answers about how requesting works. [] when it wrote
            none, and while its page hides Good to know.
          items: { $ref: "#/components/schemas/StudioFaqEntry" }
        policies:
          $ref: "#/components/schemas/StudioPolicies"

    OpeningHours:
      type: object
      description: |
        One weekday the studio opens (TAT-128): one opening and one closing time,
        24-hour, in the studio's `timezone`. Hours never run past midnight.
      required: [day, opens, closes]
      additionalProperties: false
      properties:
        day: { type: string, enum: [sun, mon, tue, wed, thu, fri, sat] }
        opens: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", examples: ["11:00"] }
        closes:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Later than `opens`, on the same day
          examples: ["20:00"]

    ClosedDays:
      type: object
      description: |
        Days the studio is closed whatever its hours say (TAT-128), from `from`
        to `to`, both included, in the studio's `timezone`.
      required: [from, to, note]
      additionalProperties: false
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date, description: "The last closed day; the same as `from` for one day" }
        note:
          type: [string, "null"]
          maxLength: 120
          description: The studio's words, one line, plain text
          examples: ["Closed for Dashain, back on 28 October"]

    StudioFaqEntry:
      type: object
      description: One of the studio's own FAQ answers. Plain text, line breaks kept; render it as text.
      required: [question, answer]
      additionalProperties: false
      properties:
        question: { type: string, minLength: 1, maxLength: 200 }
        answer: { type: string, minLength: 1, maxLength: 2000 }

    StudioPolicies:
      type: object
      description: |
        The studio's own policy sections, in its order, shown after the
        Good to know ones (deposit policy, age rule, walk-ins, closed days).
        `updatedAt` is when the policies last changed: these sections, or
        the deposit policy, age rule or walk-ins text; null when never.
        `{ updatedAt: null, sections: [] }` while its page hides Good to
        know.
      required: [updatedAt, sections]
      additionalProperties: false
      properties:
        updatedAt: { type: [string, "null"], format: date-time }
        sections:
          type: array
          maxItems: 12
          items:
            type: object
            description: A titled section. Plain text, line breaks kept; render it as text.
            required: [title, text]
            additionalProperties: false
            properties:
              title: { type: string, minLength: 1, maxLength: 80 }
              text: { type: string, minLength: 1, maxLength: 4000 }

    GoodToKnow:
      type: object
      description: |
        What clients ask before they come (TAT-128), as plain text the studio
        wrote; null when not set. Show each only when set.
      required: [walkIns, ageRule, depositPolicy, beforeSession, aftercare]
      additionalProperties: false
      properties:
        walkIns: { type: [string, "null"], maxLength: 300 }
        ageRule: { type: [string, "null"], maxLength: 200 }
        depositPolicy: { type: [string, "null"], maxLength: 2000, description: The policy the deposit page also shows }
        beforeSession: { type: [string, "null"], maxLength: 2000 }
        aftercare: { type: [string, "null"], maxLength: 2000 }

    Artist:
      type: object
      description: |
        A visible artist of the studio (TAT-44). Every property is always
        there. All text is plain text: render it as text.
      required: [id, slug, name, bio, photo, acceptingInquiries, closedMessage, workPhotos, styles, socialLinks]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: What `createInquiry` takes as `preferredArtistId`
        slug:
          type: string
          description: The artist's own link within the studio (`getArtist`)
        name: { type: string, maxLength: 120 }
        bio: { type: [string, "null"], maxLength: 1000 }
        photo:
          description: At most 2048 px on its longer side, or null
          oneOf: [{ $ref: "#/components/schemas/Photo" }, { type: "null" }]
        acceptingInquiries:
          type: boolean
          description: |
            False while the artist's books are closed: an inquiry naming
            them is the 409 `artist_not_accepting`.
        closedMessage:
          type: [string, "null"]
          maxLength: 300
          description: The artist's words to show instead of the inquiry form; null while they accept inquiries
        workPhotos:
          type: array
          maxItems: 6
          description: |
            The artist's six newest published photos, newest first; [] when
            none. An artist who is closed for inquiries still shows theirs.
            All of them are in `listWork`.
          items: { $ref: "#/components/schemas/WorkPhoto" }
        styles:
          type: array
          maxItems: 5
          description: The artist's styles from the platform's list, in the list's order; [] when none.
          items: { $ref: "#/components/schemas/TattooStyle" }
        socialLinks:
          type: array
          description: "The links the artist set, in this order: instagram, facebook, tiktok. Only https links."
          items: { $ref: "#/components/schemas/SocialLink" }

    Service:
      type: object
      required: [id, name, durationMinutes]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        durationMinutes: { type: integer, description: Estimated duration }
        startingPrice:
          oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }]

    GalleryPhoto:
      type: object
      description: |
        A tattoo in the studio's gallery (`listWork`, `getWorkPhoto`): its
        main photo, a `WorkPhoto` with its id, its styles, its healed mark and
        whose work it is, and the tattoo's other photos (`angles`, other
        angles of the same piece). The styles, the healed mark and whether it
        is published are the tattoo's, whatever photo shows it. Every
        property is always there. All text is plain text: render it as text.
      required: [id, url, width, height, alt, variants, styles, healed, artist, angles]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: |
            What `getWorkPhoto` takes: the photo's own page. The same id the
            page's `nextCursor` already carries, so it reveals nothing new.
        url:
          type: string
          format: uri
          description: Public and absolute.
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        alt:
          type: [string, "null"]
          maxLength: 200
          description: |
            The studio's own description of the photo, one line of plain
            text, or null: then build one from the artist's name, such as
            "Tattoo by Sita Rai".
        variants:
          type: array
          maxItems: 8
          description: |
            Smaller copies, narrowest first, each narrower than `width`
            (320, 640 and 1280 px, those below the photo's own width). Empty
            for a photo too small to have any: then show `url` alone. Build
            `srcset` from these and `url` at `width`.
          items: { $ref: "#/components/schemas/ImageVariant" }
        styles:
          type: array
          maxItems: 3
          description: The photo's styles from the platform's list, in the list's order; [] when none.
          items: { $ref: "#/components/schemas/TattooStyle" }
        healed:
          type: boolean
          description: True when the studio marked the photo as healed.
        artist:
          type: object
          description: "Whose work it is: the artist's page is `getArtist(slug)`."
          required: [slug, name]
          additionalProperties: false
          properties:
            slug: { type: string, examples: [sita-rai] }
            name: { type: string, maxLength: 120, examples: [Sita Rai] }
        angles:
          type: array
          maxItems: 7
          description: |
            The tattoo's other photos and videos, in the studio's order, after
            the main photo: [] for a tattoo of one photo. A tattoo is at most
            eight items (photos and videos together; the main one is always a
            photo). Each has a `kind`: a `PhotoAngle` (a `WorkPhoto` with
            `kind: "photo"`) or a `VideoAngle` (`kind: "video"`: a short
            silent clip with its poster). Neither has an id of its own (the
            tattoo is addressed by `id`). Only videos that are ready are
            listed. Skip an item whose `kind` you do not know: the list may
            grow. When an angle's `alt` is null, build one from the artist's
            name and its place in the whole tattoo, the main photo being 1:
            "Tattoo by Sita Rai, photo 2 of 4".
          items:
            oneOf:
              - $ref: "#/components/schemas/PhotoAngle"
              - $ref: "#/components/schemas/VideoAngle"
            discriminator:
              propertyName: kind
              mapping:
                photo: "#/components/schemas/PhotoAngle"
                video: "#/components/schemas/VideoAngle"

    PhotoAngle:
      type: object
      description: |
        One more photo of a tattoo (a `GalleryPhoto`'s `angles`): a
        `WorkPhoto` with its `kind`.
      required: [kind, url, width, height, alt, variants]
      additionalProperties: false
      properties:
        kind: { type: string, const: photo }
        url:
          type: string
          format: uri
          description: Public and absolute.
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        alt:
          type: [string, "null"]
          maxLength: 200
          description: The studio's own description of the photo, one line of plain text, or null.
        variants:
          type: array
          maxItems: 8
          description: |
            Smaller copies, narrowest first, each narrower than `width`
            (320, 640 and 1280 px, those below the photo's own width). Build
            `srcset` from these and `url` at `width`.
          items: { $ref: "#/components/schemas/ImageVariant" }

    VideoAngle:
      type: object
      description: |
        A short video of a tattoo (a `GalleryPhoto`'s `angles`; never its
        main photo). At most 60 seconds, with no sound: the platform strips
        the audio and every bit of metadata. Show the poster until the
        visitor plays it; never autoplay it.
      required: [kind, poster, sources, durationMs, alt]
      additionalProperties: false
      properties:
        kind: { type: string, const: video }
        poster:
          $ref: "#/components/schemas/Image"
          description: |
            A frame of the video (about 1 s in) as a still image, with its
            smaller copies like a photo's, at the size of the largest source.
        sources:
          type: array
          minItems: 1
          maxItems: 2
          description: |
            The same video at up to two sizes (720p and 1080p, by the short
            side, only those not larger than the clip), smallest first: list
            them in this order as `<source>`s, so a phone takes the smaller.
          items: { $ref: "#/components/schemas/VideoSource" }
        durationMs:
          type: integer
          minimum: 1
          maximum: 60000
          description: How long it plays, in milliseconds.
        alt:
          type: [string, "null"]
          maxLength: 200
          description: |
            The studio's own description of the video, one line of plain
            text, or null: then build a label such as "Video, 0:42".

    ReviewPage:
      type: object
      description: |
        The client's review page. Only what the link's holder may see: never
        the client's full name, phone or email, the studio's notes or another
        project's anything.
      required: [studio, project, link, styles, defaults, review, post, blocks]
      additionalProperties: false
      properties:
        studio:
          type: object
          required: [name, onDiscover]
          additionalProperties: false
          properties:
            name: { type: string }
            onDiscover:
              type: boolean
              description: Whether Discover lists the studio now. Offer the Discover consent only while it does.
        project:
          type: object
          required: [artistName, tattooedOn]
          additionalProperties: false
          properties:
            artistName:
              type: [string, "null"]
              description: The artist who made it; null when their profile is gone.
            tattooedOn:
              type: string
              format: date
              description: The day of the project's latest finished tattoo session, in the studio's timezone.
        link:
          type: object
          required: [expiresAt]
          additionalProperties: false
          properties:
            expiresAt: { type: string, format: date-time }
        styles:
          type: array
          description: The styles a post may carry (the studio's), in the platform's order.
          items: { $ref: "#/components/schemas/TattooStyle" }
        defaults:
          type: object
          description: What the form starts with when nothing is saved yet.
          required: [shownName, styles, placement]
          additionalProperties: false
          properties:
            shownName:
              type: string
              maxLength: 40
              description: The saved shown name, else the first name and the initial of the last name ("Sita R.").
            styles:
              type: array
              maxItems: 3
              description: The project's style when the studio lists it.
              items: { type: string }
            placement:
              type: [string, "null"]
              maxLength: 120
              description: The placement the client wrote in their request.
        review:
          oneOf: [{ $ref: "#/components/schemas/ClientReview" }, { type: "null" }]
        post:
          oneOf: [{ $ref: "#/components/schemas/ClientPost" }, { type: "null" }]
        blocks:
          type: object
          description: |
            Why the client can't start a new review or post now, while they
            have none: `taken_down` (TattooDrip took the last one down; it
            stays down until restored, contact the studio), `post_limit` (the
            tattoo already had two posts). Null when they can.
          required: [review, post]
          additionalProperties: false
          properties:
            review: { type: [string, "null"], enum: [taken_down, null] }
            post: { type: [string, "null"], enum: [taken_down, post_limit, null] }

    ReviewTakedown:
      type: object
      description: TattooDrip took it off every public surface. Show `sentence`.
      required: [reason, sentence, at]
      additionalProperties: false
      properties:
        reason:
          type: string
          description: "`hate`, `threats`, `personal_data`, `off_topic`, `not_a_client`, `client_request` or `other`; treat an unknown one as `other`."
        sentence: { type: string }
        at: { type: string, format: date-time }

    ClientReview:
      type: object
      required: [rating, body, shownName, consentStudioPage, consentDiscover, takenDown, createdAt, updatedAt]
      additionalProperties: false
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, minLength: 20, maxLength: 2000 }
        shownName: { type: string, minLength: 1, maxLength: 40 }
        consentStudioPage: { type: boolean }
        consentDiscover: { type: boolean }
        takenDown:
          oneOf: [{ $ref: "#/components/schemas/ReviewTakedown" }, { type: "null" }]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ClientPost:
      type: object
      required: [status, caption, styles, placement, shownName, consentStudioPage, consentDiscover, takenDown, editable, media]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [draft, waiting, approved, not_shown]
          description: |
            `draft` until the client submits it (only they see it);
            `waiting` for the studio; `approved` (shown where the client
            allowed); `not_shown` when the studio declined or took it off its
            page (the client is told nothing more).
        caption: { type: [string, "null"], maxLength: 280 }
        styles: { type: array, maxItems: 3, items: { type: string } }
        placement: { type: [string, "null"], maxLength: 120 }
        shownName: { type: string, minLength: 1, maxLength: 40 }
        consentStudioPage: { type: boolean }
        consentDiscover: { type: boolean }
        takenDown:
          oneOf: [{ $ref: "#/components/schemas/ReviewTakedown" }, { type: "null" }]
        editable:
          type: boolean
          description: Whether its photos, caption, styles and placement may still change (not taken down, not declined).
        media:
          type: array
          maxItems: 8
          description: In order; the first is the lead and always a photo.
          items: { $ref: "#/components/schemas/ReviewMedia" }

    ReviewMedia:
      type: object
      required: [id, kind, state, failure, image, sources, durationMs]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [photo, video] }
        state:
          type: string
          enum: [processing, ready, failed]
          description: A photo is always `ready`. A video is `processing` until the API has made it, then `ready` or `failed`.
        failure:
          type: [string, "null"]
          description: Why a video failed, in words for the client.
        image:
          description: The photo, or a ready video's poster. Private until the post is published, so its URL (and its copies') is signed for 5 minutes and may be on the API's or the storage's origin; read the page again for fresh ones.
          oneOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }]
        sources:
          type: array
          maxItems: 2
          description: A ready video's sizes, smallest first; muted. Signed for 5 minutes like `image`.
          items: { $ref: "#/components/schemas/VideoSource" }
        durationMs: { type: [integer, "null"], minimum: 1, maximum: 60000 }

    ReviewSubmission:
      type: object
      required: [shownName, consentStudioPage, consentDiscover]
      additionalProperties: false
      properties:
        shownName:
          type: string
          minLength: 1
          maxLength: 40
          description: 1 to 40 characters, any script; trimmed.
        consentStudioPage: { type: boolean, description: "Show on the studio's page." }
        consentDiscover: { type: boolean, description: "Show on TattooDrip Discover. While the studio isn't on Discover it can only be withdrawn: send the stored value, or false." }
        review:
          type: object
          required: [rating, body]
          additionalProperties: false
          properties:
            rating: { type: integer, minimum: 1, maximum: 5 }
            body: { type: string, minLength: 20, maxLength: 2000, description: Plain text, trimmed. }
        post:
          type: object
          required: [styles]
          additionalProperties: false
          properties:
            caption: { type: [string, "null"], maxLength: 280 }
            styles:
              type: array
              maxItems: 3
              description: Slugs from the page's `styles`.
              items: { type: string }
            placement: { type: [string, "null"], maxLength: 120 }
            order:
              type: array
              maxItems: 8
              description: Every `ReviewMedia` id of the post, in the new order; the first must be a photo. Leave it out to keep the order.
              items: { type: string, format: uuid }

    ReviewPhotoForm:
      type: object
      description: The multipart body of `addReviewPhoto`
      required: [photo]
      properties:
        photo: { type: string, format: binary, description: A JPEG, PNG or WebP of 10 MB at most. }

    ReviewVideoSignInput:
      type: object
      required: [type, size]
      additionalProperties: false
      properties:
        type: { type: string, enum: [video/mp4, video/quicktime, video/webm] }
        size: { type: integer, minimum: 1, maximum: 104857600, description: The file's exact length in bytes. }

    ReviewVideoUpload:
      type: object
      required: [upload, token]
      additionalProperties: false
      properties:
        upload:
          type: object
          required: [method, url, headers]
          additionalProperties: false
          properties:
            method: { type: string, const: PUT }
            url: { type: string, description: "Where to PUT the file: absolute, or a path on the API's origin." }
            headers:
              type: object
              description: Send exactly these with the PUT.
              additionalProperties: { type: string }
        token:
          type: string
          description: Send it to `addReviewVideo` once the PUT has finished. Good for an hour.

    ReviewVideoFinishInput:
      type: object
      required: [upload]
      additionalProperties: false
      properties:
        upload: { type: string, maxLength: 2048, description: The `token` of `signReviewVideo`. }

    VideoSource:
      type: object
      description: One size of a `VideoAngle`, an H.264 MP4 with no audio.
      required: [url, type, width, height]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          description: Public and absolute, on the same origin as the poster.
        type: { type: string, const: video/mp4 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }

    WorkFilters:
      type: object
      description: |
        What the gallery can be narrowed by. Offer only these: a filter that
        matches no photo would show an empty page.
      required: [styles, healed]
      additionalProperties: false
      properties:
        styles:
          type: array
          description: |
            The styles at least one photo carries, among the visible artists'
            published photos (only `artist`'s when it is given), in the list's order:
            offer only these. Plus the listed `style` the request asked for,
            even when none of those photos carries it, so the control that
            is on is always among them.
          items: { $ref: "#/components/schemas/TattooStyle" }
        healed:
          type: boolean
          description: Whether one of those photos is marked healed.

    FlashDesign:
      type: object
      description: |
        A flash design an artist offers (TAT-129). Every property is always
        there. All text is plain text: render it as text. It carries no key,
        hidden flag or timestamp: the list's order is newest first.
      required: [id, name, size, price, image, artist, requestable, status]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: What `createInquiry` takes as `flashDesignId`. The design's page is `/flash/<id>`.
        name: { type: string, maxLength: 80, examples: [Moth] }
        size:
          type: string
          maxLength: 60
          description: In words, such as About 3 in
          examples: [About 3 in]
        price:
          oneOf: [{ $ref: "#/components/schemas/Price" }, { type: "null" }]
          description: null when the studio keeps the price to itself.
        image:
          description: The picture. The page builds the `alt` text from the name and the artist.
          $ref: "#/components/schemas/Photo"
        artist:
          type: object
          description: "Whose design it is: the artist's page is `getArtist(slug)`."
          required: [slug, name]
          additionalProperties: false
          properties:
            slug: { type: string, examples: [sita-rai] }
            name: { type: string, maxLength: 120, examples: [Sita Rai] }
        requestable:
          type: boolean
          description: |
            Whether `createInquiry` takes a request for it now: `status` is
            `available` and the artist takes flash requests, whatever their
            books say. False: show it greyed (a claimed design is marked
            Claimed; otherwise use the artist's `closedMessage`).
        status:
          type: string
          enum: [available, claimed]
          description: |
            `claimed`: one of a kind and taken. Listed only while the studio
            shows claimed designs: show it greyed, marked Claimed; it is never
            requestable. Treat an unknown value as `claimed`.

    Price:
      type: object
      description: A price with the words to show for it. Not `Money`, which has no text.
      required: [amount, currency, text]
      additionalProperties: false
      properties:
        amount: { type: integer, minimum: 1, description: In the currency's smallest unit (paisa) }
        currency: { type: string, enum: [NPR] }
        text: { type: string, description: "Show it as it is.", examples: ["NPR 3,000"] }

    FlashFilters:
      type: object
      description: |
        What the flash list can be narrowed by. Offer only these: an artist
        with no shown design would give an empty page.
      required: [artists]
      additionalProperties: false
      properties:
        artists:
          type: array
          description: |
            The visible artists with a shown design, by name, whatever
            `artist` asks: offer only these.
          items:
            type: object
            required: [slug, name]
            additionalProperties: false
            properties:
              slug: { type: string, examples: [sita-rai] }
              name: { type: string, maxLength: 120, examples: [Sita Rai] }

    StudioReview:
      type: object
      description: |
        A client's review of the studio, as its own page shows it
        (`listReviews`). Every property is always there. All text is plain
        text: render it as text, never as markup, and keep its line breaks.
        Never the client's full name, phone, email or any id of theirs.
      required: [id, rating, body, shownName, date, artist, reply]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The review's own id (a key for lists). The page's `nextCursor` already carries it.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Whole stars. Say it in words too, such as "4 out of 5".
        body:
          type: string
          minLength: 20
          maxLength: 2000
          description: The client's own words.
        shownName:
          type: string
          minLength: 1
          maxLength: 40
          description: |
            The name the client chose to show: by default their first name
            and the initial of their last ("Sita R.").
          examples: [Sita R.]
        date:
          type: string
          format: date
          description: The day the client wrote it, in the studio's timezone.
        artist:
          description: |
            The artist who made the tattoo, while the studio shows that
            artist on its page; null otherwise. Their page is
            `getArtist(slug)`.
          oneOf:
            - type: object
              required: [slug, name]
              additionalProperties: false
              properties:
                slug: { type: string, examples: [sita-rai] }
                name: { type: string, maxLength: 120, examples: [Sita Rai] }
            - type: "null"
        reply:
          description: The studio's public reply, or null when it has none or TattooDrip took it down.
          oneOf:
            - type: object
              required: [body, date]
              additionalProperties: false
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
                date:
                  type: string
                  format: date
                  description: The day the studio last wrote it, in the studio's timezone.
            - type: "null"

    ReviewRating:
      type: object
      description: |
        The average rating and how many reviews it comes from: a studio's
        on its own page (`listReviews`, from the reviews shown there), a
        studio's or an artist's on Discover (from the reviews Discover shows
        of them). Only from 3 reviews. Show it as "4.7 from 12 reviews".
      required: [average, count]
      additionalProperties: false
      properties:
        average:
          type: number
          minimum: 1
          maximum: 5
          description: The mean of the ratings, rounded to one decimal.
          examples: [4.7]
        count: { type: integer, minimum: 3 }

    FreshInkPost:
      type: object
      description: |
        A healed tattoo a client of the studio posted and the studio
        approved (`listFreshInk`), shaped like a gallery tattoo: its main
        photo (`url`, `width`, `height`, `alt`, `variants`), always a photo,
        and its other photos and ready videos in `angles`, as `GalleryPhoto`
        has them. Every property is always there. All text is plain text:
        render it as text, never as markup. Never the client's full name,
        phone, email or any id of theirs.
      required: [id, url, width, height, alt, variants, angles, shownName, caption, styles, placement, artist, date]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The post's own id (a key for lists). The page's `nextCursor` already carries it.
        url:
          type: string
          format: uri
          description: Public and absolute.
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        alt:
          type: [string, "null"]
          maxLength: 200
          description: |
            A description of the main photo, one line of plain text, or
            null: then build one, such as "Tattoo by Sita Rai, photo 1 of 3".
        variants:
          type: array
          maxItems: 8
          description: |
            Smaller copies, narrowest first, each narrower than `width`
            (320, 640 and 1280 px, those below the photo's own width). Build
            `srcset` from these and `url` at `width`.
          items: { $ref: "#/components/schemas/ImageVariant" }
        angles:
          type: array
          maxItems: 7
          description: |
            The post's other photos and videos, in the client's order, after
            the main photo: [] for a post of one photo. As a `GalleryPhoto`'s
            `angles`: a `PhotoAngle` or a `VideoAngle` (only ready videos,
            with their posters). Skip an item whose `kind` you do not know.
          items:
            oneOf:
              - $ref: "#/components/schemas/PhotoAngle"
              - $ref: "#/components/schemas/VideoAngle"
            discriminator:
              propertyName: kind
              mapping:
                photo: "#/components/schemas/PhotoAngle"
                video: "#/components/schemas/VideoAngle"
        shownName:
          type: string
          minLength: 1
          maxLength: 40
          description: The name the client chose to show ("Sita R.").
          examples: [Sita R.]
        caption:
          type: [string, "null"]
          maxLength: 280
          description: The client's caption, or null.
        styles:
          type: array
          maxItems: 3
          description: The post's styles from the platform's list, in the list's order; [] when none.
          items: { $ref: "#/components/schemas/TattooStyle" }
        placement:
          type: [string, "null"]
          maxLength: 120
          description: Where it is on the body, in the client's words, or null.
        artist:
          description: |
            The artist who made the tattoo, while the studio shows that
            artist on its page; null otherwise.
          oneOf:
            - type: object
              required: [slug, name]
              additionalProperties: false
              properties:
                slug: { type: string, examples: [sita-rai] }
                name: { type: string, maxLength: 120, examples: [Sita Rai] }
            - type: "null"
        date:
          type: string
          format: date
          description: |
            The day it was published (its public copies made), in the
            studio's timezone. Not necessarily the day it first showed on
            this page: a post taken off (by the studio, the client or
            TattooDrip) and published again carries the later day, and a post
            published for Discover first carries that day.

    Slot:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

    SourceChannel:
      type: string
      description: How the person found the studio
      enum: [instagram, facebook, tiktok, google, friend, other]

    InquiryInput:
      type: object
      description: |
        An inquiry's text fields, kept exactly as sent (trimmed). The
        lengths are the most the API takes. Leave an optional field out, or
        empty, for none.
      required: [idea, placement, approximateSize, preferredDates, sourceChannel, contactName, contactPhone]
      properties:
        idea: { type: string, minLength: 1, maxLength: 4000, examples: [A fine-line peony with two leaves] }
        placement: { type: string, minLength: 1, maxLength: 120, examples: [Left forearm] }
        approximateSize: { type: string, minLength: 1, maxLength: 120, examples: [About 10 cm] }
        preferredDates: { type: string, minLength: 1, maxLength: 500, examples: [Any weekday in November] }
        preferredArtistId:
          type: [string, "null"]
          format: uuid
          description: A visible artist of this studio who takes inquiries. Leave it out for any artist.
        flashDesignId:
          type: [string, "null"]
          format: uuid
          description: |
            A flash design from `listFlash`. The inquiry then asks for that
            design and its artist: leave `preferredArtistId` out or give the
            design's artist.
        budget: { type: [string, "null"], maxLength: 120, description: Free text, examples: [NPR 15000] }
        style:
          type: [string, "null"]
          maxLength: 40
          description: A style's `slug` from `listStyles`, the platform's list. Leave it out for none.
          examples: [fine-line]
        colour:
          type: [string, "null"]
          enum: [black-grey, colour, undecided, null]
          description: Black and grey, colour, or not decided yet. Leave it out for none.
        notes:
          type: [string, "null"]
          maxLength: 1000
          description: Anything else the person wants the studio to know. Free text.
          examples: [A cover-up of an old name]
        sourceChannel: { $ref: "#/components/schemas/SourceChannel" }
        contactName: { type: string, minLength: 1, maxLength: 120 }
        contactPhone:
          type: string
          minLength: 1
          maxLength: 40
          description: The person's WhatsApp or Viber number, as typed. A number without a country code is read as Nepali; it is stored in E.164.
          examples: ["9812345678", "+977 981-234-5678"]
        contactEmail: { type: [string, "null"], format: email, maxLength: 254 }
        referral:
          type: string
          maxLength: 512
          description: |
            Discover's referral token (Discover D03): the `ref` parameter of a
            booking link Discover made (`bookingUrl`), passed on unchanged.
            When it verifies for this studio, the inquiry records Discover as
            its verified referral, apart from `sourceChannel`. Anything else
            (none, malformed, forged, expired, another studio's) records no
            referral and never refuses the inquiry. Grants nothing.

    InquiryForm:
      description: The multipart body of `createInquiry`
      allOf:
        - $ref: "#/components/schemas/InquiryInput"
        - type: object
          properties:
            referenceImages:
              type: array
              maxItems: 5
              description: Up to 5 JPEG, PNG or WebP images, 10 MB each and 20 MB together, each its own `referenceImages` part. Their metadata (EXIF, GPS) is removed, and only the studio sees them.
              items: { type: string, format: binary }
            website:
              type: string
              maxLength: 0
              description: A honeypot that people never see. Leave it out or empty; any other value is refused as `challenge_failed`. (The bot-challenge token goes in the `X-Challenge-Token` header; a `challengeToken` field is ignored.)

    InquiryReceipt:
      type: object
      required: [id, reference]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: The new inquiry. Nothing in the public API reads it back. }
        reference:
          type: string
          pattern: "^[2-9ABCDEFGHJKMNPQRSTVWXYZ]{6}$"
          description: |
            The request's reference, unique within the studio. Quote it when
            you message the studio. The deposit page shows the same code
            later. Nothing in the public API reads an inquiry back by it.
          examples: [K7MP3Q]

    DepositState:
      type: string
      description: |
        What the deposit page says: `due` (pay, then send a screenshot),
        `submitted` (a screenshot waits for the studio), `paid` (nothing
        left to pay), `updating` (the studio is changing the quote),
        `expired` (the quote expired) or `cancelled`.
      enum: [due, submitted, paid, updating, expired, cancelled]

    DepositPaymentMethod:
      type: object
      required: [kind, label, qrImageUrl, accountName, accountNumber, bankName]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [fonepay, esewa, khalti, bank]
        label: { type: string, examples: [eSewa] }
        qrImageUrl:
          type: [string, "null"]
          format: uri
          description: The studio's QR code, a public image.
        accountName: { type: [string, "null"] }
        accountNumber:
          type: [string, "null"]
          description: The bank account number, or the eSewa or Khalti ID.
        bankName: { type: [string, "null"] }

    DepositPage:
      type: object
      required: [studio, project, deposit, referenceCode, state, lastProofRejected, proofSubmittedAt, paymentMethods, depositPolicy, nextSession, onlinePayment]
      additionalProperties: false
      properties:
        studio:
          type: object
          required: [name]
          additionalProperties: false
          properties:
            name: { type: string }
        project:
          type: object
          required: [brief, artistName]
          additionalProperties: false
          properties:
            brief: { type: string }
            artistName: { type: [string, "null"] }
        deposit:
          type: object
          required: [amount, amountText, due, dueText, currency, payBy, payByText]
          additionalProperties: false
          properties:
            amount:
              type: integer
              minimum: 0
              description: The current quote's deposit, in paisa.
            amountText: { type: string, examples: ["NPR 3,000"] }
            due:
              type: integer
              minimum: 0
              description: What is still to pay, in paisa. Send it back as `expectedAmount`.
            dueText: { type: string, examples: ["NPR 3,000"] }
            currency: { type: string, examples: [NPR] }
            payBy:
              type: string
              format: date
              description: The quote's last valid day, in the studio's timezone.
            payByText: { type: string, examples: ["28 Oct 2026"] }
        referenceCode:
          type: string
          pattern: "^[2-9ABCDEFGHJKMNPQRSTVWXYZ]{6}$"
          description: What the client writes in the payment remark.
          examples: [7K3M9Q]
        state: { $ref: "#/components/schemas/DepositState" }
        lastProofRejected:
          type: boolean
          description: In `due`, the studio couldn't confirm the last screenshot.
        proofSubmittedAt:
          type: [string, "null"]
          format: date-time
          description: When the screenshot that waits was sent.
        paymentMethods:
          type: array
          description: The studio's payment methods, only in `due`; empty otherwise.
          items: { $ref: "#/components/schemas/DepositPaymentMethod" }
        depositPolicy:
          type: [string, "null"]
          description: The studio's own words about deposits.
        nextSession:
          description: Once the deposit is paid, the project's next session; null in every other state and when none is scheduled.
          oneOf: [{ $ref: "#/components/schemas/DepositSession" }, { type: "null" }]
        onlinePayment: { $ref: "#/components/schemas/DepositOnlinePayment" }

    DepositOnlinePayment:
      type: object
      description: |
        Paying the deposit online through the studio's own payment provider
        (startDepositCheckout).
      required: [available, checkout]
      additionalProperties: false
      properties:
        available:
          type: boolean
          description: The page may offer "Pay online" now (state `due`, and the studio takes online payments).
        checkout:
          description: The latest online attempt of the last two days, or null.
          oneOf:
            - type: object
              required: [id, status]
              additionalProperties: false
              properties:
                id: { type: string, format: uuid }
                status:
                  type: string
                  description: |
                    `confirming` (started, no confirmed payment yet: show it
                    as being checked, never as paid), `paid` (confirmed and
                    recorded), `failed` or `expired` (offer to try again).
                  enum: [confirming, paid, failed, expired]
            - { type: "null" }

    DepositCheckout:
      type: object
      required: [checkoutUrl]
      additionalProperties: false
      properties:
        checkoutUrl:
          type: string
          format: uri
          description: The provider's hosted checkout page. Valid for 30 minutes.


    DepositSession:
      type: object
      description: |
        The project's earliest session that is still scheduled and hasn't
        ended, of any kind (TAT-110).
      required: [startsAt, artistName]
      additionalProperties: false
      properties:
        startsAt:
          type: string
          format: date-time
          description: When it starts, as a UTC instant. Show it in the studio's `timezone` (getStudio).
          examples: ["2026-10-24T05:15:00.000Z"]
        artistName:
          type: [string, "null"]
          description: The session's own artist; null when that profile was deleted.

    DepositProofForm:
      type: object
      description: The multipart body of `submitDepositProof`
      required: [proof, method, expectedAmount]
      properties:
        proof:
          type: string
          format: binary
          description: The payment screenshot (JPEG, PNG or WebP, 10 MB at most). Its metadata is removed, and only the studio sees it.
        method:
          type: string
          enum: [fonepay, esewa, khalti, bank]
          description: How the client paid, one of the page's `paymentMethods` kinds.
        expectedAmount:
          type: integer
          minimum: 1
          description: The `deposit.due` the page showed, in paisa.

    DiscoverNextCursor:
      type: [string, "null"]
      description: Pass it as `cursor` for the next page, with the same filters and sort; null on the last.

    DiscoverLocation:
      type: object
      required: [country, slug, name, region]
      additionalProperties: false
      properties:
        country: { type: string, pattern: "^[A-Z]{2}$", description: ISO 3166-1 alpha-2 }
        slug: { type: string, description: Unique within its country }
        name: { type: string }
        region: { type: [string, "null"], description: The first-level subdivision, such as a province }

    DiscoverSitemapStudio:
      type: object
      required: [slug]
      additionalProperties: false
      properties:
        slug: { type: string, description: The studio's current slug }

    DiscoverSitemapArtist:
      type: object
      required: [slug, studio]
      additionalProperties: false
      properties:
        slug: { type: string, description: The artist's slug (unique per studio only) }
        studio:
          type: object
          required: [slug, type]
          additionalProperties: false
          properties:
            slug: { type: string, description: "The business's current slug: an independent's profile address" }
            type: { type: string, enum: [studio, independent] }

    DiscoverSitemapTattoo:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }

    DiscoverStudioRef:
      type: object
      required: [slug, name, type]
      additionalProperties: false
      properties:
        slug: { type: string }
        name: { type: string }
        type: { type: string, enum: [studio, independent] }

    DiscoverStudioSummary:
      type: object
      required: [id, slug, name, type, location, logo, cover, styles, storefrontUrl]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        type: { type: string, enum: [studio] }
        location:
          oneOf: [{ $ref: "#/components/schemas/DiscoverLocation" }, { type: "null" }]
        logo:
          oneOf: [{ $ref: "#/components/schemas/Logo" }, { type: "null" }]
        cover:
          oneOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }]
        styles:
          type: array
          description: The styles the studio's shown artists name, in the list's order
          items: { $ref: "#/components/schemas/TattooStyle" }
        storefrontUrl: { type: string, format: uri, description: The studio's own page }

    DiscoverStudioDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/DiscoverStudioSummary"
        - type: object
          required: [intro, timezone, socialLinks, artists, tattoos, bookingUrl]
          properties:
            intro: { type: [string, "null"], description: Plain text }
            timezone: { type: string, description: IANA, for "open now" on the studio page }
            socialLinks: { type: array, items: { $ref: "#/components/schemas/SocialLink" } }
            artists: { type: array, maxItems: 100, items: { allOf: [{ $ref: "#/components/schemas/DiscoverArtistSummary" }], unevaluatedProperties: false } }
            tattoos:
              type: array
              maxItems: 12
              description: The newest published photos
              items: { allOf: [{ $ref: "#/components/schemas/DiscoverTattooSummary" }], unevaluatedProperties: false }
            bookingUrl: { $ref: "#/components/schemas/DiscoverBookingUrl" }

    DiscoverArtistSummary:
      type: object
      required: [id, slug, name, photo, styles, acceptingInquiries, independent, studio, location, storefrontUrl]
      properties:
        id: { type: string, format: uuid, description: Stable; the `artist` filter of `listDiscoverTattoos` }
        slug: { type: string, description: Unique within the studio only }
        name: { type: string }
        photo:
          oneOf: [{ $ref: "#/components/schemas/Photo" }, { type: "null" }]
        styles: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/TattooStyle" } }
        acceptingInquiries: { type: boolean }
        independent: { type: boolean, description: "An independent artist: `studio` is their own business" }
        studio: { $ref: "#/components/schemas/DiscoverStudioRef" }
        location:
          oneOf: [{ $ref: "#/components/schemas/DiscoverLocation" }, { type: "null" }]
        storefrontUrl: { type: string, format: uri, description: The artist's page on the studio's site }

    DiscoverArtistDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/DiscoverArtistSummary"
        - type: object
          required: [bio, socialLinks, tattoos, bookingUrl]
          properties:
            bio: { type: [string, "null"], description: Plain text }
            socialLinks: { type: array, items: { $ref: "#/components/schemas/SocialLink" } }
            tattoos: { type: array, maxItems: 12, items: { allOf: [{ $ref: "#/components/schemas/DiscoverTattooSummary" }], unevaluatedProperties: false } }
            bookingUrl: { $ref: "#/components/schemas/DiscoverBookingUrl" }

    DiscoverTattooSummary:
      type: object
      required: [id, image, styles, healed, artist, studio]
      properties:
        id: { type: string, format: uuid }
        image: { $ref: "#/components/schemas/Image" }
        styles: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/TattooStyle" } }
        healed: { type: boolean }
        artist:
          type: object
          required: [id, slug, name]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
        studio: { $ref: "#/components/schemas/DiscoverStudioRef" }

    DiscoverTattooDetail:
      unevaluatedProperties: false
      allOf:
        - $ref: "#/components/schemas/DiscoverTattooSummary"
        - type: object
          required: [location, artistAcceptingInquiries, storefrontUrl, bookingUrl]
          properties:
            location:
              oneOf: [{ $ref: "#/components/schemas/DiscoverLocation" }, { type: "null" }]
            artistAcceptingInquiries:
              type: boolean
              description: Whether the photo's artist takes new requests (their `acceptingInquiries`). The booking link still works when false; the studio site then offers its general request.
            storefrontUrl: { type: string, format: uri, description: The photo's page on the studio's site }
            bookingUrl: { $ref: "#/components/schemas/DiscoverBookingUrl" }

    DiscoverBookingUrl:
      type: string
      format: uri
      description: |
        The studio site's booking form (`/book` on the studio's origin), with
        the artist (`artist`) or the photo to ask for one like (`artwork`)
        where it applies, and Discover's referral token (`ref`, 30 days),
        which the studio page passes to `createInquiry` as `referral`. Link
        to it as it is.

    DiscoverReview:
      type: object
      description: |
        A client's review on Discover (Reviews and Fresh ink, slice 4). Every
        property is always there. All text is plain text: render it as text,
        never as markup, and keep its line breaks. Never the client's full
        name, phone, email or any id of theirs.
      required: [id, rating, body, shownName, date, artist, studio, reply]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The review's own id (a key for lists).
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Whole stars. Say it in words too, such as "4 out of 5".
        body: { type: string, minLength: 20, maxLength: 2000, description: The client's own words. }
        shownName:
          type: string
          minLength: 1
          maxLength: 40
          description: The name the client chose to show ("Sita R.").
          examples: [Sita R.]
        date: { type: string, format: date, description: "The day the client wrote it, in the studio's timezone." }
        artist:
          type: object
          description: The artist who made the tattoo (always shown on Discover).
          required: [id, slug, name]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
        studio: { $ref: "#/components/schemas/DiscoverStudioRef" }
        reply:
          description: The studio's public reply, or null when it has none or TattooDrip took it down.
          oneOf:
            - type: object
              required: [body, date]
              additionalProperties: false
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
                date: { type: string, format: date, description: "The day the studio last wrote it, in its timezone." }
            - type: "null"

    DiscoverFreshInkPost:
      type: object
      description: |
        A Fresh ink post on Discover (Reviews and Fresh ink, slice 4): a
        healed tattoo a client posted, shaped like `FreshInkPost` (its main
        photo, always a photo, with its other photos and ready videos in
        `angles`; only the public copies), with the artist's `id`, the
        studio (its `slug` is its Discover profile's), the studio's place,
        and the booking destination fields an artwork has: `bookingUrl` (the
        studio site's `/book` naming the artist, with Discover's referral)
        and `storefrontUrl` (the studio's own page). All text is plain text.
        Never the client's full name, phone, email or any id of theirs.
      required: [id, url, width, height, alt, variants, angles, shownName, caption, styles, placement, date, artist, studio, location, storefrontUrl, bookingUrl]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: The post's own id (a key for lists). }
        url: { type: string, format: uri, description: Public and absolute. }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        alt:
          type: [string, "null"]
          maxLength: 200
          description: A description of the main photo, one line of plain text, or null.
        variants:
          type: array
          maxItems: 8
          description: Smaller copies, narrowest first (as `FreshInkPost`).
          items: { $ref: "#/components/schemas/ImageVariant" }
        angles:
          type: array
          maxItems: 7
          description: The post's other photos and ready videos, in the client's order. Skip an item whose `kind` you do not know.
          items:
            oneOf:
              - $ref: "#/components/schemas/PhotoAngle"
              - $ref: "#/components/schemas/VideoAngle"
            discriminator:
              propertyName: kind
              mapping:
                photo: "#/components/schemas/PhotoAngle"
                video: "#/components/schemas/VideoAngle"
        shownName: { type: string, minLength: 1, maxLength: 40, examples: [Sita R.] }
        caption: { type: [string, "null"], maxLength: 280, description: "The client's caption, or null." }
        styles:
          type: array
          maxItems: 3
          description: The post's styles from the platform's list; [] when none.
          items: { $ref: "#/components/schemas/TattooStyle" }
        placement: { type: [string, "null"], maxLength: 120, description: "Where it is on the body, in the client's words, or null." }
        date: { type: string, format: date, description: "The day it was published (its public copies made), in the studio's timezone." }
        artist:
          type: object
          required: [id, slug, name]
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
        studio: { $ref: "#/components/schemas/DiscoverStudioRef" }
        location:
          oneOf: [{ $ref: "#/components/schemas/DiscoverLocation" }, { type: "null" }]
        storefrontUrl: { type: string, format: uri, description: "The studio's own page" }
        bookingUrl: { $ref: "#/components/schemas/DiscoverBookingUrl" }
