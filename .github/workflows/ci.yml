name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Check, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tattoo_drip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tattoo_drip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Actions are pinned to full commit SHAs (a tag can be moved); the comment
    # names the tag each SHA resolved from. Bump the SHA and comment together.
    steps:
      # No later step needs Git credentials (the generated-file checks only
      # diff locally), so the token isn't left in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Installs the pnpm version pinned in package.json's packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      # The SDK and the storefront are built on these generated types, so fail
      # when openapi.yaml changed without regenerating them. Biome ignores the
      # generated file, so the output is compared as written.
      - name: Check generated API types are committed
        run: |
          pnpm --filter @tattoo-drip/types generate
          git diff --exit-code -- packages/types/src/openapi.gen.ts

      # Ace commands that boot the app, such as `migration:run` and `test`,
      # validate its env, so they need a .env. The defaults match the
      # Postgres service.
      - name: Prepare platform .env
        working-directory: apps/platform
        run: |
          cp .env.example .env
          node ace generate:key

      - run: pnpm build

      # The app connects as a restricted role; migrations run as the owner.
      - name: Create the app database role
        working-directory: apps/platform
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d tattoo_drip -v ON_ERROR_STOP=1 \
            -v app_user=tattoo_drip_app -v app_password=tattoo_drip_app -v owner_user=postgres \
            -f database/setup_roles.sql

      # Applies every migration to Postgres 18. The generator rewrites
      # database/schema.ts, so fail if that differs from the committed file.
      - name: Run migrations
        working-directory: apps/platform
        run: pnpm migrate

      - name: Check generated schema is committed
        run: |
          pnpm exec biome check --write apps/platform/database/schema.ts
          git diff --exit-code -- apps/platform/database/schema.ts

      # The video angle specs run the real ffprobe and ffmpeg on clips they
      # generate (the worker image installs the same, Dockerfile `worker`).
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - run: pnpm test
