name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Check, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tattoo_drip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tattoo_drip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      # `node ace` boots the app, which validates its env, so build, migrate
      # and test all need a .env. The defaults match the Postgres service.
      - name: Prepare platform .env
        working-directory: apps/platform
        run: |
          cp .env.example .env
          node ace generate:key

      - run: pnpm build

      # Applies every migration to Postgres 18. The generator rewrites
      # database/schema.ts, so fail if that differs from the committed file.
      - name: Run migrations
        working-directory: apps/platform
        run: node ace migration:run

      - name: Check generated schema is committed
        run: |
          pnpm exec biome check --write apps/platform/database/schema.ts
          git diff --exit-code -- apps/platform/database/schema.ts

      - run: pnpm test
