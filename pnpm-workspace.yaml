packages:
  - apps/*
  - packages/*

allowBuilds:
  '@google/genai': true
  '@sentry/cli': true
  '@swc/core': true
  core-js: true
  esbuild: true
  protobufjs: true

# Fresh AdonisJS releases pinned by the starter kit
minimumReleaseAgeExclude:
  - '@adonisjs/inertia@5.0.0-next.2'
  - '@adonisjs/vite@6.0.0-next.3'
  - '@adonisjs/assembler@8.5.2'
  - '@adonisjs/core@7.5.2'
  - '@adonisjs/http-server@9.3.1'
  - '@poppinss/utils@7.1.1'
  - lucide-react@1.48.0

# @adonisjs/queue and the platform both import @boringnode/queue; a second
# copy breaks transactional dispatch, so force one version (see
# apps/platform/docs/jobs-and-email.md, Jobs). Bump it together with @adonisjs/queue.
#
# @adonisjs/mail 10.4.0 still asks for nodemailer ^9, whose address parser has 12
# advisories fixed only in 10.1.4 (TAT-16). nodemailer 10's only breaking change is
# Node 20 or newer. Drop this once @adonisjs/mail depends on nodemailer 10.
overrides:
  '@boringnode/queue': 0.6.0
  '@adonisjs/mail>nodemailer': ^10.1.4
