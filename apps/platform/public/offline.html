<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>You're offline - Tattoo Drip</title>
	<style>
		:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
		body { margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center; background: #f7f3ee; color: #1c1917; }
		main { max-width: 20rem; padding: 2rem 1.5rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
		h1 { font-size: 1.25rem; margin: 0.5rem 0 0; }
		p { margin: 0; color: #5e5650; line-height: 1.5; }
		button { margin-top: 0.75rem; min-height: 2.75rem; padding: 0 1.25rem; border: 0; border-radius: 0.25rem; background: #4b3ba6; color: #fffdfa; font: inherit; font-weight: 600; }
		@media (prefers-color-scheme: dark) {
			body { background: #14110f; color: #efe9e2; }
			p { color: #a89f96; }
			button { background: #a99cff; color: #14110f; }
		}
	</style>
</head>
<body>
	<main>
		<img src="/icons/favicon.svg" width="56" height="56" alt="" />
		<h1>You're offline</h1>
		<p>Tattoo Drip needs a connection to show your studio.</p>
		<button type="button" onclick="location.reload()">Try again</button>
	</main>
</body>
</html>
